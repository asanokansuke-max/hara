function tonightLink(di){
  const k=di===0?'n1':di===1?'n2':null; if(!k) return '';
  const c=NOTES.filter(x=>x.scene===k).length;
  return `<button class="tonight" data-tab="notes" data-goscene="${k}">${ic('chat')}きょうのみんなのメモ ${c}件</button>`;
}
let editDelay=false;
function delayTarget(st){ /* 遅れを入れる起点：つぎの予定（飛行機は除く） */
  const {list,ni}=st; if(ni<0) return null;
  const t=list.slice(ni).find(it=>it.k!=='flight'&&it.di===list[ni].di);
  return t||null;
}
function delayBlock(st){
  const {n,list}=st;
  if(n<list[0].s-60||n>=list[list.length-1].en) return '';
  const tg=delayTarget(st); if(!tg) return '';
  const cur=tg.shift||0, k=kOf(tg), rec=DELAYS[k];
  const who=Object.values(DELAYS).filter(x=>x&&x.by).sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0];
  if(editDelay) return `<div class="delayform">
    <div class="dh">${ic('clock')}このあとの予定は、どのくらいずれそう？</div>
    <div class="chlab">遅れ</div>
    <div class="chips">${[5,10,15,20,30,45,60,90].map(m=>`<button class="btn" data-delayset="${m}" aria-pressed="${cur===m}">${m}分</button>`).join('')}</div>
    <div class="chlab">巻き（早め）</div>
    <div class="chips four"><button class="btn" data-delayset="-5" aria-pressed="${cur===-5}">5分</button><button class="btn" data-delayset="-10" aria-pressed="${cur===-10}">10分</button><button class="btn" data-delayset="-15" aria-pressed="${cur===-15}">15分</button><button class="btn" data-delayset="-30" aria-pressed="${cur===-30}">30分</button></div>
    <div class="chips one"><button class="btn" data-delayset="0" aria-pressed="${cur===0}">予定どおりに戻す</button></div>
    <div class="note">「${esc(tg.title)}」から後ろの時刻をずらして、全員の画面に表示します。飛行機の時刻は変わりません。</div>
    <div class="acts"><button class="link" data-delaycancel>閉じる</button></div></div>`;
  return cur!==0
    ? `<div class="delaybar${cur<0?' early':''}"><span>${ic('clock')}約${Math.abs(cur)}分${cur>0?'遅れ':'早め'}で進んでいます${rec&&rec.by?`<small>${esc(rec.by)}さん ${rec.at?fmtClock(rec.at):''}</small>`:''}</span><button class="link" data-delayopen>変更</button></div>`
    : `<div class="delaybar plain"><span>${ic('clock')}予定どおり</span><button class="link" data-delayopen>時間のずれを共有</button></div>`;
}
function pushDelay(min){
  const st=status(), tg=delayTarget(st); if(!tg) return;
  if(!ensureName()) return;
  const key=kOf(tg), before=DELAYS[key];
  DELAYS[key]={min,by:S.name,at:new Date().toISOString()};
  editDelay=false; renderHero(); renderDays();
  const send=()=>api('setDelay',{key,min,title:tg.title,pass:S.pass});
  send().catch(err=>{
    if(String(err).includes('PASSCODE'))
      return ask({title:'編集用のパスコード',msg:'遅れや集合時間を入力できる人だけに伝えられているパスコードです。',ok:'保存する',input:{type:'password',placeholder:'パスコード'}})
        .then(pc=>{if(!pc) throw new Error('CANCEL'); S.pass=pc; save(); return send();});
    throw err;
  }).then(d=>{gotDelays(d);renderHero();renderDays();toast(min?`このあと約${Math.abs(min)}分${min>0?'遅れ':'早め'}で共有しました`:'予定どおりに戻しました');})
    .catch(err=>{ if(before) DELAYS[key]=before; else delete DELAYS[key]; renderHero(); renderDays();
      if(!String(err).includes('CANCEL')) toast(String(err).includes('PASSCODE')?'パスコードが違うため保存できませんでした':'保存できませんでした。電波のよい場所でもう一度お試しください','err'); });
}
function goBlock(nx,from,n,lbl,planEnd){
  const [vl,vi]=nx.via?VIA[nx.via]:(nx.k==='flight'?VIA.flight:nx.k==='ferry'?VIA.ferry:[null,'pin']);
  const travel=planEnd!=null?nx.ps-planEnd:0;
  const delay=nx.shift||0, est=nx.s;
  const how=vl?`${vl}${nx.viaText?'（'+esc(nx.viaText)+'）':''}${travel>0?'で約'+dur(travel):''}`:'';
  return `<div class="go">
    <div class="lbl">${ic(vi)}${lbl}${how?'　'+how:''}</div>
    <div class="dest"><span class="num">${fmtT(est)}</span><b>${esc(nx.title)}</b></div>
    ${delay?`<div class="where" style="color:var(--sea)">到着見込み（予定表では ${nx.t}、約${Math.abs(delay)}分${delay>0?'遅れ':'早め'}）</div>`:''}
    <div class="row2"><span class="sub" style="margin-left:0">${nx.sub?esc(nx.sub):''}</span><span class="left">あと <span class="num">${dur(est-n)}</span></span></div>
    ${linksHtml(nx)}</div>`;
}
function laterBlock(st){
  if(st.ni<0) return '';
  const rest=st.list.slice(st.ni+1).filter(it=>it.di===st.nx.di).slice(0,3);
  if(!rest.length) return '';
  return `<div class="later">${rest.map(it=>`<div><span class="num">${tS(it)}</span><span>${esc(it.title)}</span></div>`).join('')}</div>`;
}
const TOPBAR={has:false,heroOut:false};
function updateTopbar(){
  const on=TOPBAR.has&&TOPBAR.heroOut&&!document.body.classList.contains('sheetOpen');
  document.getElementById('topbar').classList.toggle('on',on);
  document.body.classList.toggle('barOn',on);
}
if('IntersectionObserver' in window){
  new IntersectionObserver(es=>{TOPBAR.heroOut=!es[0].isIntersecting&&es[0].boundingClientRect.top<0;updateTopbar();},{threshold:0}).observe(document.getElementById('hero'));
}
function renderHero(){
  const st=status(), {n,list,cur,nx,prev}=st, first=list[0], last=list[list.length-1];
  const el=document.getElementById('hero');
  const sd=new Date(n*60000);
  const sim=SIM!=null?`<div class="simflag">${sd.getUTCMonth()+1}/${sd.getUTCDate()} ${fmtT(n)} として表示中　<button class="link" data-sim="clear" style="color:inherit">今の時刻に戻す</button></div>`:'';
  const startTxt=S.start==='haneda'?'羽田空港 第1ターミナル南ウイング':'小松空港 日本航空カウンター前';
  let h=sim+syncLine()+delayBlock(st), sticky='';

  if(n<first.s){
    const left=Math.floor(first.s/1440)-Math.floor(n/1440);
    h+= left>=1
      ? `${mascotImg('hero-mascot')}<div class="state">出発まで</div><div class="big"><span class="num">${left}</span><span class="unit">日</span></div>
         <div class="what">10/8（木）${fmtT(first.s).replace(/^0/,'')} 集合</div><div class="where">${startTxt}</div>`
      : `<div class="state">きょうは出発日です</div>`+goBlock(first,null,n,'最初の行き先');
    if(left<1) sticky=`<span>つぎ</span><span class="num">${first.t}</span><b>${esc(first.title)}</b><span class="m">あと${dur(first.s-n)}</span>`;
  }else if(n>=last.en){
    h+=`${mascotImg('end-mascot')}<div class="state">旅行は終了しました</div><div class="what" style="margin-top:4px">10月10日（土）17:55 小松空港着</div><div class="where">おつかれさまでした</div>`;
  }else if(cur){
    const ce=endOf(cur), total=Math.max(1,ce-cur.s), pct=Math.min(100,(n-cur.s)/total*100);
    const moving=cur.k==='flight'||cur.k==='ferry';
    const hasMeet=!!meetMin(cur);
    const verb=moving?'到着まで':(cur.e&&!hasMeet?'出発まで':'');
    h+=`<div class="state">いま</div>
        <div class="row2"><div class="what" style="margin-top:2px">${esc(cur.title)}</div>
        ${verb?`<span class="left">${verb}<br><span class="num">${dur(ce-n)}</span></span>`:''}</div>
        <div class="where">${tS(cur)}${cur.e?'〜'+tE(cur):'〜'}${cur.shift?'（予定 '+cur.t+(cur.e?'〜'+cur.e:'')+'）':''}${cur.sub?'　'+esc(cur.sub):''}</div>${spotInfo(cur,true)}
        ${(cur.e||hasMeet)&&!(hasMeet&&n>=ce)?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}
        ${moving?'':meetCard(cur,n)+linksHtml(cur)}`;
    if(nx&&nx.di===cur.di) h+=goBlock(nx,ce,n,'つぎ',cur.pen)+laterBlock(st);
    else if(nx) h+=tonightLink(cur.di)+`<div class="go"><div class="lbl">${ic('cal')}きょうの予定はここまで</div>
        <div class="dest"><span class="num">${nx.t}</span><b>${esc(nx.title)}</b></div><div class="where">${DAYS[nx.di].label}（10/${+DAYS[nx.di].date.slice(8)}）の最初の予定</div></div>`;
    const cm=meetOf(cur), cmm=meetMin(cur);
    if(nx&&!(cm&&!moving)) sticky=`<span>${nx.di===cur.di?'つぎ':'あした'}</span><span class="num">${tS(nx)}</span><b>${esc(nx.title)}</b><span class="m">あと${dur(nx.s-n)}</span>`;
  }else if(nx){
    if(prev&&prev.di===nx.di){
      const pe=endOf(prev), pct=Math.min(100,(n-pe)/Math.max(1,nx.s-pe)*100);
      h+=`<div class="state">いま　移動中</div><div class="where">${esc(prev.title)} を出発</div>`+goBlock(nx,pe,n,'向かっている先',prev.pen)
        +`<div class="bar"><i style="width:${pct}%"></i></div>`+laterBlock(st);
    }else{
      h+=`<div class="state">${DAYS[nx.di].label}（10/${+DAYS[nx.di].date.slice(8)}）</div>`+(prev&&prev.di===nx.di-1?tonightLink(prev.di):'')+goBlock(nx,null,n,'つぎ')+laterBlock(st);
    }
    sticky=`<span>つぎ</span><span class="num">${tS(nx)}</span><b>${esc(nx.title)}</b><span class="m">あと${dur(nx.s-n)}</span>`;
  }
  const gi=h.indexOf('<div class="go">');
  if(gi<0) h=`<div class="blk-plain">${h}</div>`;
  else{
    const a=h.slice(0,gi), b=h.slice(gi);
    h=(a.replace(/<div class="simflag"[^>]*>.*?<\/div>/g,'').trim()?`<div class="${cur||(prev&&nx&&prev.di===nx.di)?'blk-now':'blk-plain'}">${a}</div>`:'')+`<div class="blk-next">${b}</div>`;
  }
  el.innerHTML=noticeBar()+tokenBanner()+h;
  document.body.classList.toggle('sub',S.tab!=='plan');
  document.body.classList.toggle('onnotes',S.tab==='notes');
  if(S.tab==='plan') setTimeout(()=>{try{renderMap();}catch(_){}},60);
  let bar='';
  if(cur&&!['flight','ferry'].includes(cur.k)&&meetMin(cur)!=null){
    const m=meetOf(cur), mm=meetMin(cur);
    bar=`<span class="lb now">集合</span><span class="num">${m.t}</span><b>${esc(m.p||cur.title)}</b><span class="m now">${mm>=n?'あと'+dur(mm-n):dur(n-mm)+'過ぎ'}</span>`;
  }else if(sticky){
    bar=sticky.replace('<span>','<span class="lb next">').replace('class="m"','class="m next"');
  }
  const tb=document.getElementById('topbar'); tb.innerHTML=bar; TOPBAR.has=!!bar; updateTopbar();
}

/* ---------- days ---------- */
function defaultDay(){
  const n=nowMin(); const i=DAYS.findIndex(d=>Math.floor(toMin(d.date,'00:00')/1440)===Math.floor(n/1440));
  return i>=0?i:0;
}
let openKey=null;
function renderDays(){
  if(S.day==null) S.day=defaultDay();
  document.getElementById('days').innerHTML=DAYS.map((d,i)=>
    `<button role="tab" aria-selected="${i===S.day}" data-day="${i}"><b>${d.label}</b><span>10/${+d.date.slice(8)}（${d.wd}）</span></button>`).join('');
  const d=DAYS[S.day], n=nowMin();
  const stt=status(), cs=stt.cur, nxs=stt.nx;
  let h=`<div class="dayhead"><h2>${d.title}</h2></div><ol class="tl">`;
  d.items.forEach(it=>{
    const key=it.di+'-'+it.ii, memo=S.memos[key]||'';
    if(it.via){
      const [vl,vi]=VIA[it.via];
      h+=`<li class="via${isOff(it)?' off':''}"><span></span><span class="rail"></span><span class="lbl">${ic(vi)}${vl}${it.viaText?'　'+esc(it.viaText):''}</span></li>`;
    }
    const [kl,ki]=KIND[it.k];
    const st=isOff(it)?' off':(cs===it?' now':(nxs===it?' nexti':(n>=endOf(it)?' done':'')));
    const mt=meetOf(it);
    const openNow=openKey===key||editMeet===key;
    h+=`<li class="it k-${it.k}${st}${openNow?' open':''}" data-key="${key}">
      <div class="time num"><span class="s"${it.shift?` style="color:${it.shift>0?'var(--lava)':'var(--sea)'}"`:''}>${tS(it)}</span>${it.e?`<span class="e">${tE(it)}</span>`:''}${planTag(it)}</div>
      <div class="node"><i>${ic(ki)}</i></div>
      <div class="body">
        <button class="card" data-toggle="${key}" aria-expanded="${openNow}">
          <span class="kind"><span class="kl">${kl}</span>${st===' now'?'<span class="badge now">いまここ</span>':''}${st===' nexti'?'<span class="badge next">つぎ</span>':''}${isOff(it)?'<span class="badge off">別ルート</span>':''}</span>
          <span class="ttl" style="display:block">${esc(it.title)}</span>
          ${it.sub?`<span class="sub" style="display:block">${esc(it.sub)}</span>`:''}
          ${mt?`<span class="meetline">${ic('flag')}集合 ${mt.t||''}${mt.p?'　'+esc(mt.p):''}</span>`:''}
          ${memo?`<span class="hasmemo">${ic('note')}${esc(memo.split('\n')[0].slice(0,24))}</span>`:''}
          <span class="chev" aria-hidden="true">${ic('chevron')}</span>
        </button>
        <div class="detail">
          ${spotInfo(it)}<div style="margin:2px 0 10px">${linksHtml(it)}</div>
          ${['flight','ferry'].includes(it.k)||cs===it?'':`<div class="dlab">集合時間（みんなに共有されます）</div>${meetCard(it,n)}`}
          <div class="dlab" style="margin-top:12px">自分だけのメモ（この端末に保存）</div>
          <textarea data-memo="${key}" placeholder="例：集合場所の目印、ここで買いたいもの">${esc(memo)}</textarea>
          <div class="saved" data-saved="${key}"></div>
        </div>
      </div></li>`;
  });
  h+='</ol>'+extrasTiles();
  document.getElementById('daybody').innerHTML=h;
  try{renderMap();}catch(_){}
}

  const q=norm(mq);

/* ---------- 天気（鹿児島・熊本の3日分） ---------- */
function wx(code){
  if(code===0) return ['快晴','sun']; if(code<=2) return ['晴れ','cloudsun']; if(code===3) return ['くもり','cloud'];
  if(code<=48) return ['霧','fog']; if(code<=67||(code>=80&&code<=82)) return ['雨','rain']; if(code<=77) return ['雪','rain']; return ['雷雨','storm'];
}
/* 日ごとの天気（2日目は鹿児島と熊本の両方） */
const DAY_WX=[[['鹿児島','kagoshima']],[['鹿児島','kagoshima'],['熊本','kumamoto']],[['熊本','kumamoto']]];
function wxOf(di,key){const d=DAYS[di]&&DAYS[di].date; return WEATHER&&(WEATHER[key]||[]).find(x=>x.date===d);}
function renderWeather(){

    const [lab,icn]=wx(w.code), dd=+d.date.slice(8);
    return `<button class="wxcol${d.date===today?' today':''}" data-wx="${di}" aria-label="10/${dd} ${city} ${lab} 最高${w.max}度 最低${w.min}度 降水確率${w.rain==null?'不明':w.rain+'%'}。押すと詳しい予報">
      <div class="wxd">10/${dd}<span>${city}</span><span class="wxr num">${ic('umbrella')}${w.rain==null?'-':w.rain}%</span></div>
      <div class="wxm">${ic(icn,'i wxi')}<span class="num wxt"><b>${w.max}</b>/${w.min}°</span><span class="wxgo2">${ic('chevron')}</span></div></button>`;}).join('');
  el.innerHTML=(HAS_GAS?noticeEntry():'')+`<div class="wxcard">${cols}</div>`;

/* ---------- 今日のルート地図 ---------- */
let MAP=null, MAPLAYER=null, MAPDAY=-1, MEPOS=null;
function renderMap(){
  const wrap=document.getElementById('daymap-wrap'); if(!wrap) return;
  if(typeof L==='undefined'){wrap.style.display='none';return;}
  wrap.style.display='';
  const on=S.mapOn!==false;
  document.getElementById('mapt').innerHTML=(on?ic('x'):ic('map'))+(on?'地図を隠す':'今日のルートを地図で見る');
  document.getElementById('mapt').setAttribute('aria-expanded',String(on));
  document.getElementById('locate').innerHTML=on?ic('pin')+'現在地':'';
  document.getElementById('mapfull').innerHTML=on?ic('expand')+'全画面':'';
  document.getElementById('mapfull-t').textContent=DAYS[S.day].label+'のルート';
  const el=document.getElementById('daymap'); el.style.display=on?'':'none';
  if(!on) return;
  /* 画面にまだ出ていない（鍵の画面の裏・別のタブ）ときは描かない。大きさ0で描くと位置がずれる */
  if(!el.offsetWidth||!el.offsetHeight){MAPDAY=-1;return;}
  const st=status(), d=DAYS[S.day];
  /* その日の行程（九州の中だけ。飛行機は除く） */
  const seen={};
  const uniq=d.items.filter(it=>!isOff(it)&&it.k!=='flight').map(it=>({it,p:posOf(it),di:it.di}))
    .filter(o=>o.p&&o.p[0]<34).filter(o=>{const k=o.p.join(',');if(seen[k])return false;seen[k]=1;return true;});
  if(!MAP){
    MAP=L.map(el,{zoomControl:false,attributionControl:true,scrollWheelZoom:false,tap:true});
    L.tileLayer('https:'+'/'+'/cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,attribution:'<a href="https:'+'/'+'/maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>'}).addTo(MAP);
    L.control.zoom({position:'bottomright'}).addTo(MAP);
    MAP.attributionControl.setPrefix(false);
    MAPLAYER=L.layerGroup().addTo(MAP);
  }
  MAPLAYER.clearLayers();
  if(uniq.length>1){
    const ci=uniq.findIndex(o=>o.it===st.cur||o.it===st.nx);
    const cut=ci<0?(nowMin()>=endOf(uniq[uniq.length-1].it)?uniq.length-1:0):Math.max(0,uniq.findIndex(o=>o.it===st.cur)>=0?ci:ci-1);
    const past=uniq.slice(0,cut+1).map(o=>o.p), rest=uniq.slice(cut).map(o=>o.p);
    const draw=(pts,col,op,dash)=>{ if(pts.length<2) return;
      L.polyline(pts,{color:'#fff',weight:8,opacity:.9,lineCap:'round',lineJoin:'round'}).addTo(MAPLAYER);
      L.polyline(pts,{color:col,weight:4,opacity:op,lineCap:'round',lineJoin:'round',dashArray:dash||null}).addTo(MAPLAYER); };
    draw(past,'#9aa093',.9,'1 8');
    draw(rest,'#0f5248',.9,null);
  }
  uniq.forEach((o,i)=>{
    const it=o.it, n=nowMin();
    const cls=st.cur===it?'now':st.nx===it?'next':(n>=endOf(it)?'done':'');
    const icon=L.divIcon({className:'mk '+cls,html:`<span>${i+1}</span>`,iconSize:[26,26],iconAnchor:[13,13]});
    const mk=L.marker(o.p,{icon,title:it.title,zIndexOffset:cls==='now'?1000:cls==='next'?900:0}).addTo(MAPLAYER).bindPopup(`<b>${esc(it.title)}</b><br>${DAYS[o.di].label}　${tS(it)}${it.e?'〜'+tE(it):''}`);
    if(cls==='now'||cls==='next') mk.bindTooltip(`<b>${cls==='now'?'いま':'つぎ'}</b>${esc(it.title.replace(/\s*(集合|フェリーターミナル)$/,''))}`,{permanent:true,direction:'auto',offset:[0,0],className:'mklabel '+cls});
  });
  if(MEPOS) L.circleMarker(MEPOS,{radius:7,color:'#fff',weight:2,fillColor:'#b06f00',fillOpacity:1}).addTo(MAPLAYER).bindPopup('現在地');
  MAP.invalidateSize();
  if(MAPDAY!==S.day&&uniq.length){ MAP.fitBounds(L.latLngBounds(uniq.map(o=>o.p)),{padding:[28,28],maxZoom:14}); MAPDAY=S.day; }
}

  {t:'知覧とお茶',b:['知覧は武家屋敷と特攻の歴史で知られますが、お茶どころでもあります。鹿児島県は静岡県と並ぶお茶の産地で、知覧茶はその代表格です。','温暖な気候のおかげで、全国でもいちばん早く新茶が出回る地域のひとつ。深蒸しで、濃い緑色とまろやかな味が特徴です。','武家屋敷の庭園を見学したあと、縁側でいただく一杯は格別です。']},

  {t:'加藤清正と熊本城',b:['熊本城を築いたのは加藤清正。築城の名人として知られ、下に行くほどゆるやかで上に行くほど垂直に近づく「武者返し」の石垣が有名です。','2016年の熊本地震では、石垣や櫓が大きな被害を受けました。天守閣は2021年に復旧しましたが、城全体の復旧はこれから何十年もかかる計画です。','熊本の人は清正を「せいしょこさん」と呼び、今も親しんでいます。']},
  {t:'馬刺しとからし蓮根',b:['熊本の名物といえば馬刺し。熊本は馬肉の生産量が全国一で、赤身、霜降り、たてがみ（こうね）など部位ごとに味わいが違います。','からし蓮根は、蓮根の穴に辛子味噌を詰めて揚げたもの。病弱だった熊本藩主・細川忠利のために、滋養食として考えられたと伝わります。','どちらもお土産にできますが、馬刺しは冷凍、からし蓮根は日持ちが短いので、買うタイミングに注意です。']},
  {t:'くまモンのこと',b:['熊本県のPRキャラクター、くまモン。2010年に九州新幹線の全線開業に合わせて生まれました。','熊本県内の企業なら、くまモンのイラストを無料で使えるのが大きな特徴。だから、熊本に来るとあちこちにくまモンがいます。','熊本空港はくまモングッズの宝庫。最後のお土産探しにどうぞ。']},
  {t:'鹿児島で食べたいもの',b:['黒豚は、しゃぶしゃぶでもとんかつでも。バラとロースの両方の味が楽しめるのがしゃぶしゃぶの良さです。地鶏の炭火焼や、銀色の帯模様がきれいなキビナゴの刺身も鹿児島ならでは。','さつま揚げは地元では「つけあげ」。揚げたてはもちろん冷めてもおいしく、れんこん天やごぼう天など種類も豊富です。','甘いものなら、2本の串に刺した小さな餅に甘辛いタレをかけた両棒餅（ぢゃんぼもち）と、練乳をかけたかき氷にフルーツをのせた白熊。仙巌園の近くには両棒餅のお店が並びます。','お酒は芋焼酎。お湯割りなら、先にお湯、あとから焼酎を注ぐのが鹿児島流です。']},
  {t:'熊本で食べたいもの',b:['熊本の名物といえば馬刺し。赤身、霜降り、たてがみ（こうね）など、部位ごとに味わいが違います。熊本は馬肉の生産量が日本一です。','からし蓮根は、蓮根の穴に辛子味噌を詰めて揚げたもの。ほかに、わけぎをぐるぐる巻いて酢味噌で食べる「一文字のぐるぐる」、春雨のスープ麺「太平燕（タイピーエン）」も熊本の味です。','熊本ラーメンは、豚骨に揚げたニンニク（マー油やチップ）の香りが特徴。阿蘇のあか牛や、天草大王という大きな地鶏も名物です。','おやつは、さつまいもとあんこを生地で包んで蒸した「いきなり団子」。城彩苑の中でも買えます。']},
  {t:'お土産えらびのヒント',b:['鹿児島の定番は、かるかん（山芋と米粉の蒸し菓子）、さつま揚げ、芋焼酎、かごしま茶。さつまいものスイーツもたくさんあります。','工芸品なら、色ガラスを重ねて削った薩摩切子、細かな絣模様の本場大島紬、白薩摩・黒薩摩の薩摩焼、屋久杉の小物など。仙巌園の近くには薩摩切子の工場もあります。','熊本では、いきなり団子、からし蓮根、くまモンのお菓子やグッズ、球磨焼酎。熊本空港はくまモングッズが充実しています。','重いもの・割れ物は、お店から宅配で送ると帰りが楽です。']},
  {t:'鹿児島弁・熊本弁ひとこと',b:['【鹿児島弁】だれやめ＝晩酌／わっぜ＝とても（「わっぜうまか」）／おやっとさぁ＝おつかれさま／よかにせ＝いい男／あいがとさげもした＝ありがとうございました','【熊本弁】あとぜき＝開けた戸は閉めること／たいぎゃ＝とても（「たいぎゃうまか」）／むしゃんよか＝かっこいい／ばってん＝だけど／のさん＝しんどい','現地の人に一言使ってみると、会話がはずむかもしれません。']}
];

/* 服装の目安（気温・雨・風・紫外線から） */
function dressTips(w,city,dd){
  const t=[];
  if(w.max>=27) t.push('日中は半袖で十分。冷房の効いたバスや店内用に薄い羽織りを');
  else if(w.max>=23) t.push('長袖シャツ1枚か、半袖＋薄手の羽織り');
  else if(w.max>=18) t.push('長袖に、カーディガンや薄手のジャケット');
  else t.push('ニットやジャケットなど、しっかりした上着');
  if(w.min<=15) t.push(`朝晩は${w.min}°まで下がります。上着を1枚`);
  else if(w.max-w.min>=8) t.push('朝晩と日中の差が大きいので、脱ぎ着しやすい服で');
  if(w.rain>=50) t.push('雨の可能性が高め。折りたたみ傘と、濡れても困らない靴を');
  else if(w.rain>=30) t.push('にわか雨に備えて折りたたみ傘を');
  if(w.wind!=null&&w.wind>=8) t.push('風が強め。帽子は飛ばされやすいので注意');
  if(w.uv!=null&&w.uv>=6) t.push('日差しが強め。日焼け止め・帽子・サングラスがあると安心');
  if(dd===8) t.push('桜島・有村溶岩展望所では火山灰が舞うことがあります。マスクやメガネがあると安心');
  if(dd===9) t.push('知覧・仙巌園は屋外を歩く時間が長め。歩きやすい靴で');
  if(dd===10) t.push('熊本城・水前寺は坂や砂利道があります。歩きやすい靴で');
  return t;
}
function openWeather(di){
  if(!WEATHER) return;
  di=di==null?(S.day||0):di;
  const cols=(DAY_WX[di]||[]).map(([city,key])=>[DAYS[di].date,city,key]);
  const today=fmtDateKey(nowMin());
  const body=cols.map(([d,city,key])=>{
    const w=(WEATHER[key]||[]).find(x=>x.date===d); if(!w) return '';
    const [lab,icn]=wx(w.code); const dd=+d.slice(8), wd=['木','金','土'][dd-8]||'';
    const hours=(w.hours||[]).map(o=>{const [hl,hi]=wx(o.code);return `<div class="wxh"><span>${o.h}時</span>${ic(hi,'i')}<b class="num">${o.temp}°</b><span class="wxhr">${o.rain==null?'':o.rain+'%'}</span></div>`;}).join('');
    return `<section class="wxday${d===today?' today':''}">
      <div class="wxdh">${ic(icn,'i wxbig')}<div><div class="wxdt">10/${dd}（${wd}）${city}</div><div class="wxds">${lab}</div></div>
        <div class="wxdtemp num"><b>${w.max}°</b><span>${w.min}°</span></div></div>
      <div class="wxstats">
        <div><span>体感</span><b class="num">${w.feelMax!=null?w.feelMax+'° / '+w.feelMin+'°':'-'}</b></div>
        <div><span>降水確率</span><b class="num">${w.rain==null?'-':w.rain+'%'}${w.mm?' ・'+w.mm+'mm':''}</b></div>
        <div><span>風（最大）</span><b class="num">${w.wind!=null?w.wind+' m/s':'-'}</b></div>
        <div><span>紫外線</span><b class="num">${w.uv!=null?w.uv:'-'}</b></div>
        <div><span>日の出・日の入り</span><b class="num">${w.sunrise||'-'} ・ ${w.sunset||'-'}</b></div>
      </div>
      ${hours?`<div class="wxhours">${hours}</div>`:''}
      <div class="wxdress"><div class="wxdl">${ic('shirt')}服装の目安</div><ul>${dressTips(w,city,dd).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      <a class="link" href="https:${'/'+'/'}www.google.com/search?q=${encodeURIComponent((city==='鹿児島'?'鹿児島市':'熊本市')+' 天気 10月'+dd+'日')}" target="_blank" rel="noopener">${city}の天気をくわしく調べる</a>
    </section>`;}).join('');
  openInfoSheet(DAYS[di].label+'の天気と服装の目安',body+`<div class="note">予報は変わることがあります。出発前日にもう一度確認してください。</div>`);
}

function noteApi(fn,arg,optimistic,okMsg){
  const before=JSON.parse(JSON.stringify(NOTES));
  if(optimistic){optimistic();renderNotes();renderHero();}
  return api(fn,arg).then(r=>{gotNotes(r);renderNotes();renderHero();if(okMsg)toast(okMsg);return true;})
    .catch(()=>{NOTES=before;renderNotes();renderHero();toast('保存できませんでした。電波のよい場所でもう一度お試しください','err');return false;});
}

const TABS=[['plan','日程','cal'],['notes','みんなのメモ','chat'],['my','マイページ','user'],['info','情報','info']];
/* 新着＝まだ「みんなのメモ」で見ていない、他の人の共有メモ（時刻ではなくメモのIDで覚える） */
function newNotes(){
  const seen=new Set(S.seenIds||[]);
  return NOTES.filter(x=>x.shared!==false&&!x.mine&&!seen.has(x.id)).length;
}
function markNotesSeen(){
  S.seenIds=NOTES.filter(x=>x.shared!==false).map(x=>x.id).slice(-500);
  delete S.seen; save();
}
function renderNav(){
  const nn=S.tab==='notes'?0:newNotes();
  document.getElementById('nav').innerHTML=TABS.map(([k,l,i])=>`<button data-tab="${k}" ${S.tab===k?'aria-current="page"':''}${k==='notes'&&nn?` aria-label="${l}（新着${nn}件）"`:''}>${ic(i)}${l}${k==='notes'&&nn?'<span class="dot"></span>':''}</button>`).join('');
  TABS.forEach(([k])=>document.getElementById('t-'+k).classList.toggle('on',S.tab===k));
}
function renderAll(){
  [renderNav,renderHero,renderWeather,renderDays,renderInfo,renderNotes].forEach(f=>{
    try{f();}catch(err){console.error(err);window.__showErr&&window.__showErr(f.name+': '+(err&&err.message||err));}
  });
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-refresh],[data-tab],[data-day],[data-toggle],[data-start],[data-pack],[data-packdel],[data-packreset],[data-sim],[data-clear],[data-mapfull],[data-noticehide],[data-noticeedit],[data-columns],[data-mapt],[data-locate],[data-dia],[data-wx],[data-wxclose],[data-gotoken],[data-packadd],[data-view-size],[data-view-toggle],[data-delayopen],[data-delayset],[data-delaycancel],[data-scene],[data-note],[data-want],[data-vis],[data-kind],[data-nkind],[data-vis],[data-meetedit],[data-meetq],[data-meetsave],[data-meetdel],[data-meetcancel]');
  if(!t) return;
  const ds=t.dataset;
  if(ds.tab){if(ds.tab!==S.tab&&editMeet){if(!(await confirmDiscard()))return;renderSheet();renderNotes();}
    if(ds.goscene)noteScene=ds.goscene;
    if(ds.tab===S.tab){window.scrollTo({top:0,behavior:SB()});return;} /* 今のタブをもう一度押すと先頭へ */
    SCROLL[S.tab]=window.scrollY;
    if(ds.tab==='notes'){markNotesSeen();renderNotes();}
    S.tab=ds.tab;save();renderNav();renderHero();
    if(ds.goscene) window.scrollTo(0,0);
    else if(SCROLL[ds.tab]!=null) window.scrollTo(0,SCROLL[ds.tab]);
    else{window.scrollTo(0,0);if(ds.tab==='plan')scrollToNow();}
  }
  else if('refresh' in ds){manualPull();}
  else if(ds.day){S.day=+ds.day;openKey=null;save();renderDays();}
  else if(ds.toggle){openKey=openKey===ds.toggle?null:ds.toggle;renderDays();if(openKey) setTimeout(()=>reveal(document.querySelector('#daybody .it.open')),60);}
  else if(ds.start){S.start=ds.start;save();renderInfo();renderMy();renderHero();renderDays();}
  else if(ds.packdel!=null){const p=S.pack[+ds.packdel];S.pack.splice(+ds.packdel,1);delete S.packOk[p];save();renderPack();}
  else if(ds.pack!=null){const p=S.pack[+ds.pack];S.packOk[p]=!S.packOk[p];save();renderPack();}
  else if('packreset' in ds){S.packOk={};save();renderPack();}
  else if(ds.meetedit){editMeet=ds.meetedit;renderHero();renderDays();meetInit=meetSnap();const i=document.getElementById('mt');if(i)i.focus();}
  else if(ds.meetq){const i=document.getElementById('mt');if(i)i.value=ds.meetq;}
  else if(ds.meetsave){
    const t=(document.getElementById('mt').value||'').slice(0,5), pl=document.getElementById('mp').value.trim();
    editMeet=null; meetInit=null; pushMeet(ds.meetsave,t,pl);
  }
  else if(ds.meetdel){if(await ask({title:'この集合時間を消しますか？',msg:'みんなの画面からも消えます。',ok:'消す',danger:true})){editMeet=null;meetInit=null;pushMeet(ds.meetdel,'','');}}
  else if('meetcancel' in ds){if(!(await confirmDiscard())) return; renderHero();renderDays();}
  else if(ds.scene){
    noteScene=ds.scene; renderNotes();
  }
  else if(ds.want){
    if(!ensureName()) return;
    const id=ds.want;
    noteApi('toggleWant',{id},()=>{const x=NOTES.find(n=>n.id===id); if(!x) return; x.wants=x.wants||[];
      const i=x.wants.indexOf(S.name); if(i>=0) x.wants.splice(i,1); else x.wants.push(S.name);});
  }
  else if(ds.note==='new'){
    if(noteForm&&!(await confirmDiscard())) return;
    noteForm={shared:ds.shared!=='0'};
    renderSheet();
    const i=document.getElementById('nf-title');if(i)setTimeout(()=>i.focus(),250);
  }
  else if(ds.vis||ds.kind){
    const keep=NF_IDS.map(id=>document.getElementById(id).value);
    if(ds.vis) noteForm.shared=ds.vis==='1'; else noteForm.kind=ds.kind;
    document.getElementById('sheet-b').innerHTML=noteFormHtml();
    NF_IDS.forEach((id,i)=>document.getElementById(id).value=keep[i]);
  }
  else if(ds.nkind){
    noteKind=ds.nkind; renderNotes();
  }
  else if(ds.note==='edit'){if(noteForm&&!(await confirmDiscard())) return; noteForm={id:ds.id}; renderSheet();}
  else if(ds.note==='cancel'){if(!(await confirmDiscard())) return; renderSheet();}
  else if(ds.note==='del'){
    const x=NOTES.find(n=>n.id===ds.id);
    if(await ask({title:'このメモを消しますか？',msg:x&&x.shared===false?'':'みんなの画面からも消えます。',ok:'消す',danger:true}))
      noteApi('deleteNote',{id:ds.id},()=>{NOTES=NOTES.filter(n=>n.id!==ds.id);},'メモを消しました');
  }
  else if(ds.note==='save'){
    const title=document.getElementById('nf-title').value.trim();
    if(!title){toast('お店やお土産の名前を入れてください','err');document.getElementById('nf-title').focus();return;}
    if(!ensureName()) return;
    const arg={scene:document.getElementById('nf-scene').value,title,shared:!!noteForm.shared,kind:noteForm.kind||'shop',
      body:document.getElementById('nf-body').value.trim(),url:document.getElementById('nf-url').value.trim()};
    const id=noteForm.id; noteForm=null; renderSheet();
    if(id) noteApi('updateNote',Object.assign({id},arg),()=>{const x=NOTES.find(n=>n.id===id); if(x) Object.assign(x,arg);},'更新しました');
    else noteApi('addNote',arg,()=>{NOTES.push(Object.assign({id:'tmp'+Date.now(),by:S.name,at:new Date().toISOString(),wants:[],mine:true},arg));},arg.shared?'みんなに共有しました':'自分だけのメモに保存しました');
    noteScene=arg.scene;
  }
  else if(ds.clear){
    const lab='予定ごとのメモ';
    if(await ask({title:lab+'をすべて消しますか？',ok:'すべて消す',danger:true})){S[ds.clear]={};editMeet=null;save();renderAll();toast('消しました');}
  }
  else if('delayopen' in ds){editDelay=true;renderHero();}
  else if('delaycancel' in ds){editDelay=false;renderHero();}
  else if(ds.delayset!=null){pushDelay(Number(ds.delayset));}
  else if(ds.viewSize){S.view.size=ds.viewSize;save();applyView();renderMy();toast('文字の大きさを変えました');}
  else if(ds.viewToggle){const k=ds.viewToggle;S.view[k]=!S.view[k];save();applyView();renderMy();}
  else if(ds.packadd){if(!S.pack.includes(ds.packadd)){S.pack.push(ds.packadd);save();renderPack();toast('「'+ds.packadd+'」を足しました');}}
  else if('gotoken' in ds){if(!goTokenUrl()) toast('アドレスを切り替えられませんでした','err');}
  else if(ds.wx!=null&&ds.wx!==''){openWeather(+ds.wx);}
  else if('wxclose' in ds){closeWeather();}
  else if('mapt' in ds){S.mapOn=S.mapOn===false;save();renderMap();}
  else if('mapfull' in ds){toggleMapFull();}
  else if('locate' in ds){locateMe();}
  else if('columns' in ds){openColumns();}
  else if('noticeedit' in ds){editNotice();}
  else if('noticehide' in ds){try{localStorage.setItem(KEY+'-notice-hid',NOTICE.text+'|'+NOTICE.until);}catch(_){} renderHero();}
  else if(ds.sim){
    if(ds.sim==='set'){const v=document.getElementById('simin').value; if(/^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(v)) SIM=toMin(v.slice(0,10),v.slice(11,16));}
    else SIM=null;
    S.day=defaultDay(); S.tab='plan'; renderAll(); window.scrollTo(0,0); scrollToNow();
  }
});
let memoTimer;
document.addEventListener('input',e=>{
  if(e.target.dataset.memo){
    const k=e.target.dataset.memo,v=e.target.value;
    if(v) S.memos[k]=v; else delete S.memos[k];
    clearTimeout(memoTimer);
    memoTimer=setTimeout(()=>{save();const s=document.querySelector(`[data-saved="${k}"]`);if(s)s.textContent='保存しました';},400);
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='memq'){mq=e.target.value;document.getElementById('memlist').innerHTML=memberRows();}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='addform'){
    const v=document.getElementById('addin').value.trim();
    if(v&&!S.pack.includes(v)){S.pack.push(v);save();}
    renderPack(); document.getElementById('addin').focus();
  }
});
/* メモ欄を閉じたときにカードのメモ表示を更新 */
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.memo){save();}});

(function(){
  let x0=null,y0=0;
  const el=document.getElementById('daybody');
  el.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;},{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0==null) return; const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=null;
    if(Math.abs(dx)<70||Math.abs(dy)>45) return;
    if(isTypingIn('#daybody')) return;
    const nd=S.day+(dx<0?1:-1); if(nd<0||nd>=DAYS.length) return;
    S.day=nd; openKey=null; save(); renderDays();
    const top=document.getElementById('days').getBoundingClientRect().top+window.scrollY-10;
    if(window.scrollY>top) window.scrollTo({top,behavior:SB()});
  },{passive:true});
})();
function scrollToNow(){
  requestAnimationFrame(()=>{const el=document.querySelector('#daybody .it.now')||document.querySelector('#daybody .it:not(.done):not(.off)');
    const n=nowMin(); if(!el||n<ALL()[0].s-60) return;
    const y=el.getBoundingClientRect().top+window.scrollY-140; if(y>200) window.scrollTo({top:y,behavior:SB()});});
}
S.day=defaultDay();
renderAll(); if(S.tab==='plan') scrollToNow();
pull(); setInterval(pull,30000);
let lastDay=Math.floor(nowMin()/1440);
setInterval(()=>{
  const a=document.activeElement, typing=a&&/INPUT|TEXTAREA/.test(a.tagName);
  if(!editMeet&&!editDelay&&!(typing&&a.closest('#hero'))) renderHero();
  if(!(typing&&a.closest('#t-notes,#t-my'))) renderNotes();
  const d=Math.floor(nowMin()/1440); if(d!==lastDay){lastDay=d;S.day=defaultDay();}
  if(!editMeet&&!(typing&&a.closest('#daybody'))) renderDays();
},20000);
document.getElementById('sheet').addEventListener('click',async e=>{
  if(e.target.id!=='sheet') return;
  if(!(await confirmDiscard())) return; renderSheet();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('mapFull')) toggleMapFull(false);});
document.getElementById('wxsheet').addEventListener('click',e=>{if(e.target.id==='wxsheet') closeWeather();});
document.getElementById('topbar').addEventListener('click',()=>window.scrollTo({top:0,behavior:SB()}));
(function(){
  const ptr=document.getElementById('ptr'); let y0=null,pull=0;
  document.addEventListener('touchstart',e=>{ if(window.scrollY>0||document.body.classList.contains('sheetOpen')||!['plan','notes','my'].includes(S.tab)){y0=null;return;} y0=e.touches[0].clientY; pull=0; },{passive:true});
  document.addEventListener('touchmove',e=>{ if(y0==null) return; const dy=e.touches[0].clientY-y0; if(dy<=0){pull=0;ptr.style.height='0px';return;}
    pull=Math.min(90,dy*0.5); ptr.classList.add('drag'); ptr.style.height=pull+'px'; ptr.textContent=pull>=60?'離すと更新します':'引っぱって更新'; },{passive:true});
  document.addEventListener('touchend',()=>{ if(y0==null) return; y0=null; ptr.classList.remove('drag');
    if(pull>=60){ptr.textContent='更新しています…';ptr.style.height='40px';manualPull();setTimeout(()=>ptr.style.height='0px',900);}
    else ptr.style.height='0px'; },{passive:true});
})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderHero();renderDays();pull();}});
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>
