<script>
/* 表示中にエラーが起きたら、真っ白にせず画面に内容を出す */
(function(){
  function show(msg){
    var el=document.getElementById('hero'); if(!el) return;
    if(el.getAttribute('data-err')) return; el.setAttribute('data-err','1');
    el.insertAdjacentHTML('afterbegin','<div style="background:#fff;border:2px solid #8a2d14;border-radius:12px;padding:14px;margin:12px 0;color:#8a2d14;font-weight:700;font-size:14px;line-height:1.6">'
      +'表示中にエラーが起きました。この画面のスクリーンショットを送ってください。<br><code style="display:block;margin-top:6px;color:#141814;font-size:12.5px;word-break:break-all">'
      +String(msg).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];})+'</code></div>');
  }
  window.__showErr=show;
  window.addEventListener('error',function(e){show((e.message||'error')+(e.lineno?'（'+e.lineno+'行目）':''));});
  window.addEventListener('unhandledrejection',function(e){show('処理エラー: '+(e.reason&&e.reason.message||e.reason));});
})();
</script>

function reveal(el){
  if(!el) return;
  const box=el.closest('.bd')||null;
  /* 画面の上に貼りついている帯（つぎの帯・日付タブ）の下からを見える範囲とする */
  let stick=0;
  if(!box) document.querySelectorAll('#days,#mini,.minibar,.stickybar').forEach(s=>{const cs=getComputedStyle(s);if(cs.position==='sticky'||cs.position==='fixed'){const r=s.getBoundingClientRect();if(r.top<=2&&r.bottom>0)stick=Math.max(stick,r.bottom);}});
  if(!box){const dz=document.getElementById('days');if(dz){const cs=getComputedStyle(dz);if(cs.position==='sticky')stick=Math.max(stick,parseFloat(cs.top||0)+dz.offsetHeight);}}
  const vh=box?box.clientHeight:(window.innerHeight-(document.querySelector('nav')?.offsetHeight||0)-stick);
  const top0=box?box.getBoundingClientRect().top:stick;
  const r=el.getBoundingClientRect(), h=r.height, top=r.top-top0;
  let delta;
  if(h<=vh-24) delta=top-(vh-h)/2;     /* 収まる：中央に */
  else delta=top-12;                   /* 収まらない：頭を上に */
  if(Math.abs(delta)<4) return;
  if(box) box.scrollBy({top:delta,behavior:SB()}); else window.scrollBy({top:delta,behavior:SB()});
}

function ask({title,msg='',ok='OK',cancel='キャンセル',danger=false,input=null,choices=null}){
  return new Promise(res=>{
    const d=document.getElementById('dlg'), i=document.getElementById('dlg-i'), ch=document.getElementById('dlg-ch');
    ch.innerHTML=choices?choices.map(c=>`<button data-choice="${esc(String(c.v))}">${esc(c.label)}</button>`).join(''):'';
    ch.style.display=choices?'grid':'none';
    document.getElementById('dlg-o').style.display=choices?'none':'';
    document.getElementById('dlg-t').textContent=title;
    document.getElementById('dlg-m').textContent=msg;
    const o=document.getElementById('dlg-o'), c=document.getElementById('dlg-c');
    o.textContent=ok; c.textContent=cancel; o.classList.toggle('danger',danger);
    if(input){i.style.display='';i.type=input.type||'text';i.value=input.value||'';i.placeholder=input.placeholder||'';}
    else i.style.display='none';
    const done=v=>{d.classList.remove('on');o.onclick=c.onclick=d.onclick=i.onkeydown=document.onkeydown=ch.onclick=null;res(v);};
    ch.onclick=e=>{const b=e.target.closest('[data-choice]'); if(b) done(b.getAttribute('data-choice'));};
    o.onclick=()=>done(input?i.value.trim():true);
    c.onclick=()=>done((input||choices)?null:false);
    d.onclick=e=>{if(e.target===d) done(input?null:false);};
    i.onkeydown=e=>{if(e.key==='Enter') o.click();};
    document.onkeydown=e=>{if(e.key==='Escape') c.click();};
    d.classList.add('on');
    setTimeout(()=>(input?i:o).focus(),30);
  });
}

const PDFJS_VER='3.11.174';
let PDFJS=null, PV={doc:null,id:'',zoom:1,io:null,token:0};
function loadPdfjs(){
  if(PDFJS) return PDFJS;
  /* 表示部品の読み込み先：①しおりと同じ場所（GitHubの trip/lib/）②jsDelivr ③cdnjs の順に試す */
  const self=/github\.io$/.test(location.hostname)?'lib/':'https:'+'/'+'/asanokansuke-max.github.io/hara/trip/lib/';
  const bases=[self,'https:'+'/'+'/cdn.jsdelivr.net/npm/pdfjs-dist@'+PDFJS_VER+'/legacy/build/','https:'+'/'+'/cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFJS_VER+'/'];
  const tryLoad=i=>new Promise((ok,ng)=>{
    if(i>=bases.length){ng(new Error('表示部品を読み込めませんでした'));return;}
    if(window.pdfjsLib){ try{ delete window.pdfjsLib; }catch(_){ window.pdfjsLib=undefined; } }
    const s=document.createElement('script'); s.src=bases[i]+'pdf.min.js';
    s.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=bases[i]+'pdf.worker.min.js'; PV.lib=bases[i]; ok(window.pdfjsLib);}catch(e){ s.remove(); tryLoad(i+1).then(ok,ng);} };
    s.onerror=()=>{ s.remove(); tryLoad(i+1).then(ok,ng); };
    document.head.appendChild(s);
  });
  PDFJS=tryLoad(0).catch(e=>{PDFJS=null;throw e;});
  return PDFJS;
}
async function openPdf(id){
  const p=pamOf(id); if(!p) return;
  const v=document.getElementById('pdfv'), b=document.getElementById('pdfv-b');
  document.getElementById('pdfv-t').textContent=p.t;
  PV.file=null; setSaveLabel('準備中…',true);
  document.getElementById('pdfv-p').textContent='';
  b.innerHTML='<div class="pv-msg">読み込み中…</div>'; b.scrollTop=0;
  PV.zoom=1; document.getElementById('pdfv-z').textContent='100%';
  v.hidden=false; document.body.classList.add('pdfOpen');
  if(!b._sc){ b._sc=1; b.addEventListener('scroll',()=>requestAnimationFrame(showPdfPage),{passive:true}); }
  /* スワイプで戻る・端末の戻るボタンでも閉じられるように */
  if(!(history.state&&history.state.pdf)) history.pushState({pdf:1},'');
  const tk=++PV.token;
  try{
    const lib=await loadPdfjs();
    let doc;
    try{ doc=await lib.getDocument({url:pdfUrl(id)}).promise; }
    catch(err){
      /* PDFそのものが見つからないときは、そのまま知らせる */
      if(err&&/Missing|404|Unexpected server response/i.test(String(err.message||err))) throw new Error('PDFが見つかりません（'+pdfUrl(id)+'）');
      /* 表示部品側の問題なら、ワーカーなしでもう一度 */
      doc=await lib.getDocument({url:pdfUrl(id),disableWorker:true}).promise;
    }
    if(tk!==PV.token) return;
    PV.doc=doc; PV.id=id;
    await layoutPdf();
    /* 保存用に、読み込んだデータをそのままファイルにしておく（押した瞬間に保存画面を出すため） */
    doc.getData().then(d=>{ if(tk!==PV.token) return; PV.file=new File([d],pamOf(id).t.replace(/[\\/:*?"<>|]/g,'')+'.pdf',{type:'application/pdf'}); setSaveLabel('保存する',false); }).catch(()=>setSaveLabel('保存する',false));
  }catch(e){
    if(tk!==PV.token) return;
    setSaveLabel('保存する',false);
    const why=String((e&&(e.name||'')+' '+(e.message||''))||e).slice(0,140);
    b.innerHTML=`<div class="pv-msg">しおりの中で開けませんでした。<br>電波のよいところで開き直すか、下の「保存する」を試してください。<small class="pv-why">${esc(why)}</small></div>`;
  }
}
async function layoutPdf(){
  const b=document.getElementById('pdfv-b'), doc=PV.doc; if(!doc) return;
  if(PV.io) PV.io.disconnect();
  const W=Math.floor(b.clientWidth*PV.zoom);   /* 横は画面の幅ぴったり */
  const first=await doc.getPage(1), vp0=first.getViewport({scale:1});
  b.innerHTML=''; const inner=document.createElement('div'); inner.className='pv-in'; inner.id='pdfv-in'; inner.style.width=W+'px';
  for(let i=1;i<=doc.numPages;i++){
    const d=document.createElement('div'); d.className='pv-pg'; d.dataset.n=i;
    d.style.width=W+'px'; d.style.height=Math.round(W*vp0.height/vp0.width)+'px';
    inner.appendChild(d);
  }
  b.appendChild(inner);
  PV.io=new IntersectionObserver(es=>es.forEach(en=>{
    if(en.isIntersecting) renderPdfPage(en.target,W);
    else if(en.target.dataset.done){ /* 画面から遠いページは描画を捨ててメモリを空ける（iPhoneは画像の合計に上限がある） */
      const c=en.target.querySelector('canvas'); if(c){c.width=0;c.height=0;} en.target.innerHTML=''; delete en.target.dataset.done; }
  }),{root:b,rootMargin:'1200px 1200px'});
  inner.querySelectorAll('.pv-pg').forEach(d=>PV.io.observe(d));
  showPdfPage();
}
async function renderPdfPage(d,W){

      h+=`<div class="state">いま　移動中</div><div class="where">${esc(prev.title)} を出発</div>`+goBlock(nx,pe,n,'向かっている先',prev.pen)
        +`<div class="bar"><i style="width:${pct}%"></i></div>`+laterBlock(st);
    }else{
      h+=`<div class="state">${DAYS[nx.di].label}（10/${+DAYS[nx.di].date.slice(8)}）</div>`+(prev&&prev.di===nx.di-1?tonightLink(prev.di):'')+goBlock(nx,null,n,'つぎ')+laterBlock(st);
    }
    sticky=`<span>つぎ</span><span class="num">${tS(nx)}</span><b>${esc(nx.title)}</b><span class="m">あと${dur(nx.s-n)}</span>`;
  }
  const gi=h.indexOf('<div class="go">');
  if(gi<0) h=`<div class="blk-plain">${h}</div>`;

    const a=h.slice(0,gi), b=h.slice(gi);

  }
  el.innerHTML=noticeBar()+tokenBanner()+h;
  document.body.classList.toggle('sub',S.tab!=='plan');
  document.body.classList.toggle('onnotes',S.tab==='notes');
  if(S.tab==='plan') setTimeout(()=>{try{renderMap();}catch(_){}},60);
  let bar='';
  if(cur&&!['flight','ferry'].includes(cur.k)&&meetMin(cur)!=null){
    const m=meetOf(cur), mm=meetMin(cur);
    bar=`<span class="lb now">集合</span><span class="num">${m.t}</span><b>${esc(m.p||cur.title)}</b><span class="m now">${mm>=n?'あと'+dur(mm-n):dur(n-mm)+'過ぎ'}</span>`;
  }else if(sticky){
    bar=sticky.replace('<span>','<span class="lb next">').replace('class="m"','class="m next"');
  }
  const tb=document.getElementById('topbar'); tb.innerHTML=bar; TOPBAR.has=!!bar; updateTopbar();
}

      const sec=([k,l])=>{const g=grp(k);return g.length?`<div class="scenehead">${esc(l)}<span class="num">${g.length}</span></div>`+g.map(noteCard).join(''):'';};
      const now=SCENES.filter(([k])=>!scenePast(k)), past=SCENES.filter(([k])=>scenePast(k));
      const pastN=past.reduce((a,[k])=>a+grp(k).length,0);
      body=now.map(sec).join('')+(pastN?`<details class="pastnotes"><summary>終わった日のメモ<span class="num">${pastN}</span></summary>${past.map(sec).join('')}</details>`:'');
    }else body=ls.map(noteCard).join('');
    if(!body&&HAS_GAS&&!SYNC.at) body=`<div class="loading">読み込み中…</div>`;
    else if(!body) body=`<div class="empty">${mascotImg('empty-mascot')}まだメモはありません。<br>行きたいお店や買いたいお土産を<br>書いてみましょう。</div>`;
  }
  el.innerHTML=`<div class="blk" style="margin-top:8px">
    ${syncBar()}
    <div class="sgrid" role="group" aria-label="いつ・どこで">
      <button data-scene="all" aria-pressed="${noteScene==='all'}"><b>すべて</b><span class="num">${NOTES.length}</span></button>
      ${[['n1','1日目'],['n2','2日目'],['d3','3日目'],['etc','その他']].map(([k,l])=>`<button data-scene="${k}" aria-pressed="${noteScene===k}"${cnt(k)?'':' class="z"'}><b>${l}</b><span class="num">${cnt(k)}</span></button>`).join('')}
    </div>
    <div class="kindbar"><button data-nkind="all" aria-pressed="${noteKind==='all'}">すべて</button>${Object.entries(KINDS).map(([k,v])=>`<button data-nkind="${k}" aria-pressed="${noteKind===k}">${v.short}</button>`).join('')}</div>
    ${body}
    <div class="note">「共有する」は参加者全員に、「共有しない」は自分だけに表示されます。</div>
  </div>`;
  renderMy();
}

/* ---------- 天気（鹿児島・熊本の3日分） ---------- */
function wx(code){
  if(code===0) return ['快晴','sun']; if(code<=2) return ['晴れ','cloudsun']; if(code===3) return ['くもり','cloud'];
  if(code<=48) return ['霧','fog']; if(code<=67||(code>=80&&code<=82)) return ['雨','rain']; if(code<=77) return ['雪','rain']; return ['雷雨','storm'];
}
/* 日ごとの天気（2日目は鹿児島と熊本の両方） */
const DAY_WX=[[['鹿児島','kagoshima']],[['鹿児島','kagoshima'],['熊本','kumamoto']],[['熊本','kumamoto']]];
function wxOf(di,key){const d=DAYS[di]&&DAYS[di].date; return WEATHER&&(WEATHER[key]||[]).find(x=>x.date===d);}
/* 1日の天気：「曇り時々雨」のような言い方があればそれを使い、アイコンも言い方に合わせる */
function wxDay(w){
  const ph=w.phrase||''; if(!ph) return wx(w.code);
  const rep={'晴れ':0,'曇り':3,'雨':61,'雪':71,'雷雨':95};
  const parts=ph.split(/のち|時々|一時/), a=parts[0], b=parts[1];
  let code=rep[a]; if(code==null) return wx(w.code);
  if(b&&/時々|一時/.test(ph)&&((a==='晴れ'&&b==='曇り')||(a==='曇り'&&b==='晴れ'))) code=2;   /* 晴れ時々曇り → 晴れときどき曇りのアイコン */
  /* 雨・雪・雷が混じる日は、そのマークも並べる（例：曇り時々雨 → 雲｜雨） */
  const subCode=b&&rep[b]!=null&&/雨|雪/.test(b)?rep[b]:null;
  return [ph, wx(code)[1], subCode!=null?wx(subCode)[1]:null, /のち/.test(ph)?'のち':/一時/.test(ph)?'一時':'時々'];
}
/* 天気アイコン（2つ目があれば小さく添える） */
function wxIcons(w,cls){
  const [,a,b,c]=wxDay(w);
  return b?`<span class="wxic2">${ic(a,'i '+(cls||''))}<i class="wxsep">${c==='のち'?'›':'|'}</i>${ic(b,'i wxsub')}</span>`:ic(a,'i '+(cls||''));
}
function renderWeather(){
  const el=document.getElementById('weather'); if(!el) return;
  if(!WEATHER||!WEATHER.kagoshima){el.innerHTML=HAS_GAS?noticeEntry():'';return;}
  /* 3日分を1段で。押した日の詳しい予報が開く（2日目は鹿児島の予報を表示し、詳細では熊本も） */
  const today=fmtDateKey(nowMin());
  const cols=DAYS.map((d,di)=>{const [city,key]=(DAY_WX[di]||[])[0]||[]; const w=key&&wxOf(di,key); if(!w) return '';
    const [lab,icn]=wxDay(w), dd=+d.date.slice(8);
    return `<button class="wxcol${d.date===today?' today':''}" data-wx="${di}" aria-label="10/${dd} ${city} ${lab} 最高${w.max}度 最低${w.min}度 降水確率${w.rain==null?'不明':w.rain+'%'}。押すと詳しい予報">
      <div class="wxd">10/${dd}<span>${city}</span><span class="wxr num">${ic('umbrella')}${w.rain==null?'-':w.rain}%</span></div>
      <div class="wxm">${wxIcons(w,'wxi')}<span class="num wxt"><b>${w.max}</b>/${w.min}°</span><span class="wxgo2">${ic('chevron')}</span></div><div class="wxph">${esc(lab)}</div></button>`;}).join('');
  el.innerHTML=(HAS_GAS?noticeEntry():'')+`<div class="wxcard">${cols}</div>`;
}
let SPOT_OPEN=''; /* 上部カードで開いている見どころ（自動更新しても閉じないように） */

/* ---------- 今日のルート地図 ---------- */
let MAP=null, MAPLAYER=null, MAPDAY=-1, MEPOS=null;
function renderMap(){
  const wrap=document.getElementById('daymap-wrap'); if(!wrap) return;
  if(typeof L==='undefined'){wrap.style.display='none';return;}
  wrap.style.display='';
  const on=S.mapOn!==false;
  document.getElementById('mapt').innerHTML=(on?ic('x'):ic('map'))+(on?'地図を隠す':'今日のルートを地図で見る');
  document.getElementById('mapt').setAttribute('aria-expanded',String(on));
  document.getElementById('locate').innerHTML=on?ic('pin')+'現在地':'';
  document.getElementById('mapfull').innerHTML=on?ic('expand')+'全画面':'';
  document.getElementById('mapfull-t').textContent=DAYS[S.day].label+'のルート';
  const el=document.getElementById('daymap'); el.style.display=on?'':'none';
  if(!on) return;
  /* 画面にまだ出ていない（鍵の画面の裏・別のタブ）ときは描かない。大きさ0で描くと位置がずれる */
  if(!el.offsetWidth||!el.offsetHeight){MAPDAY=-1;return;}
  const st=status(), d=DAYS[S.day];
  /* その日の行程（九州の中だけ。飛行機は除く） */
  const seen={};
  const uniq=d.items.filter(it=>!isOff(it)&&it.k!=='flight').map(it=>({it,p:posOf(it),di:it.di}))
    .filter(o=>o.p&&o.p[0]<34).filter(o=>{const k=o.p.join(',');if(seen[k])return false;seen[k]=1;return true;});
  if(!MAP){
    MAP=L.map(el,{zoomControl:false,attributionControl:true,scrollWheelZoom:false,tap:true});
    L.tileLayer('https:'+'/'+'/cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,attribution:'<a href="https:'+'/'+'/maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>'}).addTo(MAP);
    L.control.zoom({position:'bottomright'}).addTo(MAP);
    MAP.attributionControl.setPrefix(false);
    MAPLAYER=L.layerGroup().addTo(MAP);
  }
  MAPLAYER.clearLayers();
  if(uniq.length>1){
    const ci=uniq.findIndex(o=>o.it===st.cur||o.it===st.nx);
    const cut=ci<0?(nowMin()>=endOf(uniq[uniq.length-1].it)?uniq.length-1:0):Math.max(0,uniq.findIndex(o=>o.it===st.cur)>=0?ci:ci-1);
    const past=uniq.slice(0,cut+1).map(o=>o.p), rest=uniq.slice(cut).map(o=>o.p);
    const draw=(pts,col,op,dash)=>{ if(pts.length<2) return;
      L.polyline(pts,{color:'#fff',weight:8,opacity:.9,lineCap:'round',lineJoin:'round'}).addTo(MAPLAYER);
      L.polyline(pts,{color:col,weight:4,opacity:op,lineCap:'round',lineJoin:'round',dashArray:dash||null}).addTo(MAPLAYER); };
    draw(past,'#9aa093',.9,'1 8');
    draw(rest,'#0b8a5e',.9,null);
  }
  uniq.forEach((o,i)=>{
    const it=o.it, n=nowMin();
    const cls=st.cur===it?'now':st.nx===it?'next':(n>=endOf(it)?'done':'');
    const icon=L.divIcon({className:'mk '+cls,html:`<span>${i+1}</span>`,iconSize:[26,26],iconAnchor:[13,13]});
    const mk=L.marker(o.p,{icon,title:it.title,zIndexOffset:cls==='now'?1000:cls==='next'?900:0}).addTo(MAPLAYER).bindPopup(`<b>${esc(it.title)}</b><br>${DAYS[o.di].label}　${tS(it)}${it.e?'〜'+tE(it):''}`);
    if(cls==='now'||cls==='next') mk.bindTooltip(`<b>${cls==='now'?'いま':'つぎ'}</b>${esc(it.title.replace(/\s*(集合|フェリーターミナル)$/,''))}`,{permanent:true,direction:'auto',offset:[0,0],className:'mklabel '+cls});
  });
  if(MEPOS) L.circleMarker(MEPOS,{radius:7,color:'#fff',weight:2,fillColor:'#b06f00',fillOpacity:1}).addTo(MAPLAYER).bindPopup('現在地');
  MAP.invalidateSize();
  if(MAPDAY!==S.day&&uniq.length){ MAP.fitBounds(L.latLngBounds(uniq.map(o=>o.p)),{padding:[28,28],maxZoom:14}); MAPDAY=S.day; }
}

  if(w.rain>=50) t.push('雨の可能性が高め。折りたたみ傘と、濡れても困らない靴を');
  else if(w.rain>=30) t.push('にわか雨に備えて折りたたみ傘を');
  if(w.wind!=null&&w.wind>=8) t.push('風が強め。帽子は飛ばされやすいので注意');
  if(w.uv!=null&&w.uv>=6) t.push('日差しが強め。日焼け止め・帽子・サングラスがあると安心');
  if(dd===8) t.push('桜島・有村溶岩展望所では火山灰が舞うことがあります。マスクやメガネがあると安心');
  if(dd===9) t.push('知覧・仙巌園は屋外を歩く時間が長め。歩きやすい靴で');
  if(dd===10) t.push('熊本城・水前寺は坂や砂利道があります。歩きやすい靴で');
  return t;
}

        <div><span>紫外線</span><b class="num">${w.uv!=null?w.uv:'-'}</b></div>
        <div><span>日の出・日の入り</span><b class="num">${w.sunrise||'-'} ・ ${w.sunset||'-'}</b></div>
      </div>

    pull=Math.min(90,dy*0.5); ptr.classList.add('drag'); ptr.style.height=pull+'px'; ptr.textContent=pull>=60?'離すと更新します':'引っぱって更新'; },{passive:true});
  document.addEventListener('touchend',()=>{ if(y0==null) return; y0=null; ptr.classList.remove('drag');
    if(pull>=60){ptr.textContent='更新しています…';ptr.style.height='40px';manualPull();setTimeout(()=>ptr.style.height='0px',900);}
    else ptr.style.height='0px'; },{passive:true});
})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderHero();renderDays();pull();}});
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>
