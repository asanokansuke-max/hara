<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5248">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅のしおり">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="config.js"></script>
<meta name="app-version" content="10/07 09:01">

<title>鹿児島・熊本 3日間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceee8; --paper:#ffffff; --ink:#141814; --muted:#4f5648; --line:#c9cfc0; color-scheme:light;
  --sea:#0f5248; --lava:#b06f00; --lava-soft:rgba(196,128,15,.16);
  --now-bg:#fdf0d8; --next-bg:#e2efe9; --sea-soft:rgba(15,82,72,.12); --dim:.42;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15.5px;font-weight:500;line-height:1.6;-webkit-font-smoothing:antialiased}
.num{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.wrap{max-width:560px;margin:0 auto;padding:0 18px calc(88px + env(safe-area-inset-bottom,0px))}

/* header */
header{padding:22px 0 6px}
header h1{font-size:22px;font-weight:900;margin:0;letter-spacing:.02em}
header .meta{color:var(--muted);font-size:13px;margin-top:2px}

/* hero */
.hero{margin:14px 0 8px;padding:18px 18px 18px;background:var(--paper);border-left:4px solid var(--lava);border-radius:2px 12px 12px 2px}
.hero .state{font-size:14px;color:var(--lava);font-weight:900;letter-spacing:.04em}
.hero .big{display:flex;align-items:baseline;gap:8px;margin:2px 0 6px}
.hero .big .num{font-size:56px;font-weight:900;line-height:1}
.hero .big .unit{font-size:15px;font-weight:900}
.hero .what{font-weight:900;font-size:27px;line-height:1.3;letter-spacing:.01em}
.hero .where{color:var(--muted);font-size:13.5px;font-weight:700}
.hero .next{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px;display:flex;gap:10px;align-items:baseline}
.hero .next .num{font-size:22px;font-weight:800}

.hero .row2{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hero .left{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.hero .left .num{font-size:34px;font-weight:900;color:var(--lava);line-height:1}
.bar{height:4px;background:var(--line);border-radius:2px;margin:10px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lava);border-radius:2px}
.go{margin-top:18px;padding-top:16px;border-top:2px dashed var(--line)}
.go .lbl{font-size:14px;color:var(--sea);font-weight:900;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.go .lbl svg{width:15px;height:15px}
.go .dest{display:flex;align-items:baseline;gap:12px;margin-top:4px;flex-wrap:wrap}
.go .dest .num{font-size:40px;font-weight:900;line-height:1}
.go .dest b{font-size:24px;line-height:1.3;font-weight:900}
.go .sub{color:var(--muted);font-size:13px;margin-left:calc(30px*1.3 + 10px)}
.go .actions{margin:10px 0 0}
.later{margin-top:12px;font-size:13px}
.later div{display:flex;gap:10px;padding:3px 0;color:var(--muted)}
.later .num{font-size:16px;font-weight:800;color:var(--ink);width:42px}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  margin:0 -18px;padding:9px 18px;display:none;align-items:baseline;gap:10px;font-size:13.5px;text-align:left;width:calc(100% + 36px)}
.sticky.on{display:flex}
.sticky .num{font-size:20px;font-weight:800}
.sticky b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sticky span.m{color:var(--lava);font-weight:900;white-space:nowrap}
.sim{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sim input{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 10px;font-size:14px}
.simflag{font-size:12px;color:var(--lava);margin-bottom:4px}

/* 集合時間メモ */
.meet{margin-top:12px;padding:12px 14px;border:1.5px solid var(--lava);border-radius:10px}
.meet .mh{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--lava);font-weight:900}
.meet .mh svg{width:15px;height:15px}
.meet .mh .link{margin-left:auto;font-weight:500}
.meet .mrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:2px}
.meet .mt{font-size:44px;font-weight:900;line-height:1}
.meet .place{font-size:14.5px;font-weight:900;margin-top:4px}
.meet .plan{font-size:12px;color:var(--muted);margin-top:2px}
.meet.soon{background:var(--lava-soft)}
.meet.late{background:var(--lava);color:var(--paper);border-color:var(--lava)}
.meet.late .mh,.meet.late .left,.meet.late .left .num,.meet.late .plan,.meet.late .link{color:var(--paper)}
.meetadd{margin-top:12px;width:100%;justify-content:center;padding:11px;border-style:dashed;border-color:var(--lava);color:var(--lava);font-weight:900;background:transparent}
.meetform{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.meetform label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px}
.meetform .quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
.meetform .quick .btn{padding:5px 10px;font-size:13px}
.meetform input{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 10px;font-size:15px;width:100%}
.meetform input[type=time]{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:22px;font-weight:800;width:auto;min-width:130px}
.meetform .acts{display:flex;gap:8px;align-items:center;margin-top:10px}
.meetline{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--lava);font-weight:900;margin-top:3px}
.meetline svg{width:14px;height:14px}
.dfield{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-bottom:8px}
.dfield input{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:7px 10px;font-size:14px;min-width:0}
.dlab{font-size:12.5px;color:var(--muted);margin:4px 0}

/* 一番上の集合パネル */
header.compact{padding:14px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
header.compact h1{font-size:15px}
header.compact .meta{font-size:12px;margin:0}
.hero .meet{margin-top:14px;padding:16px 18px 18px;border-width:2px;border-radius:14px;background:var(--paper)}
.hero .meet.soon{background:var(--lava-soft)}
.hero .meet.late{background:var(--lava)}
.hero .meet .mh{font-size:14px}
.hero .meet .mt{font-size:72px;letter-spacing:-.01em}
.hero .meet .left{font-size:14px}
.hero .meet .left .num{font-size:40px}
.hero .meet .place{font-size:19px;margin-top:6px}
.hero .meetadd{margin-top:14px;padding:18px;font-size:16px;border-width:2px;border-radius:14px}
.hero .meetform{margin-top:14px;background:var(--paper)}
.hero .links{margin-top:10px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links .btn{flex:1 1 auto;justify-content:center}

/* 日程以外のタブでは上部を簡潔に */
body.sub .hero .links,body.sub .hero .later,body.sub .hero .go .sub{display:none}
body.sub .hero .meetadd{padding:12px}

/* いま（琥珀）とつぎ（深緑）の色分け */
.hero{background:none;border:0;padding:0;border-radius:0}
.hero .blk-now,.hero .blk-next,.hero .blk-plain{padding:16px 16px 16px 18px;border-radius:4px 14px 14px 4px}
.hero .blk-plain{background:var(--paper);border-left:6px solid var(--lava)}
.hero .blk-now{background:var(--now-bg);border-left:6px solid var(--lava)}
.hero .blk-next{background:var(--next-bg);border-left:6px solid var(--sea);margin-top:10px}
.hero .blk-next .go{margin-top:0;padding-top:0;border-top:0}
.hero .blk-next .go .dest .num{color:var(--sea)}
.hero .blk-next .left .num{color:var(--sea)}
.hero .blk-next .bar{background:rgba(15,82,72,.18)}
.hero .blk-next .bar i{background:var(--sea)}
.hero .blk-next .later{border-top:1.5px dashed rgba(15,82,72,.3);padding-top:8px}
.hero .blk-next .btn,.hero .blk-now .btn{background:var(--paper)}
.hero .blk-now .meet{background:var(--paper)}
.hero .blk-now .meet.soon{background:#fff7e8;box-shadow:0 0 0 3px var(--lava-soft)}
.hero .blk-now .bar{background:rgba(176,111,0,.2)}
.hero .state{display:flex;align-items:center;gap:6px}
.hero .blk-now .state::before,.hero .blk-next .go .lbl::before{content:"";width:10px;height:10px;border-radius:50%;flex:none}
.hero .blk-now .state::before{background:var(--lava)}
.hero .blk-next .go .lbl::before{background:var(--sea)}
.hero .blk-next .go .lbl{font-size:14px}
.hero .blk-now .meet.late{background:var(--lava);border-color:var(--lava);color:#fff;box-shadow:none}
.hero .blk-now .meet.late .mh,.hero .blk-now .meet.late .left,.hero .blk-now .meet.late .left .num,
.hero .blk-now .meet.late .plan,.hero .blk-now .meet.late .link,.hero .blk-now .meet.late .mt,.hero .blk-now .meet.late .place{color:#fff}
.hero .meet .mrow{flex-wrap:wrap;row-gap:4px}
.hero .meet .mt{font-size:clamp(50px,16vw,72px)}
.hero .meet .left{min-width:0}
.hero .meet .left .num{font-size:clamp(28px,9vw,40px)}
/* 日程一覧の「つぎ」 */
.it.nexti .card{background:var(--sea-soft)}
.it.nexti .node i{background:var(--sea);border-color:var(--sea)}
.it.nexti .kind{color:var(--sea)}

/* day switch */
.days{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0 6px;border-bottom:1px solid var(--line)}
.days button{padding:10px 0 9px;text-align:center;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.days button b{display:block;font-size:14px}
.days button span{font-size:12px}
.days button[aria-selected="true"]{color:var(--ink);border-color:var(--sea)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 4px}
.dayhead h2{margin:0;font-size:16px}
.dayhead small{color:var(--muted)}

/* timeline */
.tl{list-style:none;margin:6px 0 0;padding:0}
.via{display:grid;grid-template-columns:64px 18px 1fr;color:var(--muted);font-size:12.5px;min-height:30px;align-items:center}
.via .rail{justify-self:center;width:0;height:100%;border-left:2px dotted var(--line)}
.via .lbl{display:flex;align-items:center;gap:6px;padding-left:10px}
.via .lbl svg{width:15px;height:15px}
.it{display:grid;grid-template-columns:64px 18px 1fr;align-items:start}
.it .time{padding-top:8px;text-align:right;padding-right:10px;line-height:1.05}
.it .time .s{font-size:22px;font-weight:800;display:block}
.it .time .e{font-size:14px;color:var(--muted);font-weight:700}
.it .node{justify-self:center;position:relative;height:100%;width:18px}
.it .node::before{content:"";position:absolute;left:8px;top:0;bottom:0;border-left:2px solid var(--line)}
.it .node i{position:absolute;left:3px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--sea)}
.tl > :first-child .node::before{top:15px}
.tl > :last-child .node::before{bottom:auto;height:15px}
.it .body{padding:6px 0 14px 10px;min-width:0}
.it .card{width:100%;text-align:left;padding:8px 10px;border-radius:10px;display:block}
.it .kind{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sea);font-weight:700}
.it .kind svg{width:15px;height:15px}
.it .ttl{font-weight:900;font-size:15.5px;line-height:1.45;margin-top:1px}
.it .sub{color:var(--muted);font-size:13.5px;font-weight:700}
.it .hasmemo{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:3px}
.it .hasmemo svg{width:13px;height:13px}
.it.done .card{opacity:.55}
.it.off{opacity:var(--dim)}
.it.now .card{background:var(--lava-soft)}
.it.now .node i{background:var(--lava);border-color:var(--lava);box-shadow:0 0 0 5px var(--lava-soft)}
.it.now .kind{color:var(--lava)}
.nowtag{font-size:11.5px;font-weight:900;color:var(--lava);margin-left:auto}
.detail{padding:4px 10px 4px;display:none}
.it.open .detail{display:block}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;font-weight:700;text-decoration:none;background:var(--paper)}
.btn:active{background:var(--line)}
textarea{width:100%;font-weight:700;min-height:72px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 10px;font-size:14px;line-height:1.5}
.saved{font-size:12px;color:var(--muted);height:16px}

/* sections */
section.tab{display:none}
section.tab.on{display:block}
.blk{margin:22px 0}
.blk h3{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:700}
.rows{background:var(--paper);border-radius:12px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:900;font-size:14.5px;line-height:1.4}
.row .d{color:var(--muted);font-size:13px;font-weight:700}
.row .ic{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;text-decoration:none;flex:none}
.row .when{width:52px;flex:none;font-size:12.5px;color:var(--muted);line-height:1.3}
.flight{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center}
.flight .no{font-weight:900;font-size:18px}
.flight .route{font-size:14px}
.flight .tm{font-size:18px;font-weight:800;text-align:right;line-height:1.1}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:10px 8px;font-size:13.5px;line-height:1.35}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sea);color:var(--paper);font-weight:900}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}

/* checklist / roster */
.chk{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.box{width:22px;height:22px;border:1.6px solid var(--muted);border-radius:6px;display:grid;place-items:center;flex:none}
.box svg{width:15px;height:15px;opacity:0}
.chk.ok .box{background:var(--sea);border-color:var(--sea);color:var(--paper)}
.chk.ok .box svg{opacity:1}
.chk.ok .lab{color:var(--muted);text-decoration:line-through}
.chk .lab{flex:1;min-width:0}
.chk .no{width:22px;color:var(--muted);font-size:15px;text-align:right}
.chk .kana{display:block;font-size:11.5px;color:var(--muted)}
.chk .x{color:var(--muted);padding:4px}
.chk .x svg{width:16px;height:16px}
.add{display:flex;gap:8px;margin-top:10px}
.add input,.search{flex:1;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:9px 12px;font-size:14px;width:100%}
.counter{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.counter .num{font-size:34px;font-weight:900}
.counter .num small{font-size:18px;color:var(--muted);font-weight:700}
.link{color:var(--sea);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}

/* みんなのメモ */
.scenes{display:flex;gap:0;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;touch-action:pan-x;border-bottom:1px solid var(--line);margin:4px -18px 12px;padding:0 18px;scrollbar-width:none}
.scenes::-webkit-scrollbar{display:none}
.scenes button{flex:none;padding:10px 12px 9px;font-size:13.5px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.scenes button[aria-pressed="true"]{color:var(--ink);border-color:var(--sea)}
.scenes button{display:inline-flex;align-items:center;gap:6px;height:44px}
.cnt{display:inline-grid;place-items:center;min-width:21px;height:21px;padding:0 4px;border-radius:11px;border:1.5px solid currentColor;
  font-family:"Barlow Condensed",system-ui,sans-serif;font-size:14px;font-weight:800;line-height:1}
.cnt.zero{opacity:.45}
.scenes button[aria-pressed="true"] .cnt{border-color:var(--sea);color:var(--sea)}
.note-card{background:var(--paper);border-radius:12px;padding:14px 14px 12px;margin-bottom:10px;border:1px solid var(--line)}
.note-card.private{background:var(--bg);border-style:dashed;border-color:var(--muted)}
.note-card.private .sc{color:var(--muted)}
.note-card .sc svg{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.vis{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vis button{padding:10px 6px;font-size:14px;font-weight:700;background:#fff}
.vis button + button{border-left:1px solid var(--line)}
.vis.kinds{grid-template-columns:repeat(3,1fr)}
.kindbar{display:flex;gap:16px;margin:-4px 0 12px;font-size:13.5px;font-weight:700}
.kindbar button{color:var(--muted);padding:2px 0;border-bottom:2px solid transparent}
.kindbar button[aria-pressed="true"]{color:var(--ink);border-color:var(--lava)}
.vis button[aria-pressed="true"]{background:var(--sea);color:#fff}
.planmemo{background:var(--paper);border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line)}
.planmemo .sc{font-size:12px;color:var(--muted);font-weight:900}
.planmemo .nt{font-size:15.5px;font-weight:900;margin-top:2px}
.planmemo .nb{font-size:14.5px;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.subhead{font-size:13.5px;color:var(--muted);font-weight:900;margin:18px 0 8px}
.note-card .sc{font-size:12px;color:var(--sea);font-weight:900}
.note-card .nt{font-size:18px;font-weight:900;line-height:1.35;margin-top:2px}
.note-card .nb{font-size:14.5px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.note-card .who{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:6px}
.note-card .wants{font-size:12.5px;color:var(--lava);font-weight:700;margin-top:4px}
.note-card .links{margin-top:10px}
.note-card .links .btn{flex:0 1 auto}
.want{border-color:var(--lava)!important;color:var(--lava)}
.want[aria-pressed="true"]{background:var(--lava)!important;color:#fff!important}
.note-form{background:var(--paper);border:1.5px solid var(--sea);border-radius:12px;padding:14px;margin-bottom:14px}
.note-form label{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin:10px 0 4px}
.note-form label:first-child{margin-top:0}
.note-form input,.note-form select,.note-form textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 10px;font-size:15px;font-weight:700;font-family:inherit}
.note-form textarea{min-height:64px}
.note-form .acts{display:flex;gap:8px;align-items:center;margin-top:12px}
.write{width:100%;justify-content:center;padding:13px;border:2px dashed var(--sea);color:var(--sea);font-size:15px;background:transparent;margin-bottom:14px}
.empty{color:var(--muted);font-weight:700;font-size:14px;padding:18px 4px;text-align:center}
.tonight{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:14px;font-weight:900;color:var(--sea);text-decoration:underline;text-underline-offset:3px}
.tonight svg{width:16px;height:16px}

/* メンバー */
.mem{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.mem:first-child{border-top:0}
.mem .no{width:24px;text-align:right;color:var(--muted);font-size:16px}
.mem .nm{font-weight:700;font-size:15.5px;line-height:1.35}
.mem .kana{display:block;font-size:12px;color:var(--muted);font-weight:700}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;white-space:nowrap;color:var(--muted);border-top:2px solid transparent;margin-top:-1px}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--ink);border-color:var(--sea);font-weight:900}
@media (prefers-reduced-motion:no-preference){
  .it.now .node i{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 9px transparent}}
}

/* ---- 使い心地 ---- */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
/* iPhoneで入力欄をタップしたときに画面が拡大されないよう16px以上に */
.dfield input,.sim input,textarea,.add input,.search,.note-form input,.note-form select,.note-form textarea,.meetform input:not([type=time]){font-size:16px}
button,.btn,a.ic{transition:transform .08s ease,opacity .08s ease}
button:active,.btn:active,a.ic:active{transform:scale(.97);opacity:.8}
@media (prefers-reduced-motion:no-preference){
  section.tab.on{animation:tabin .18s ease-out}
  @keyframes tabin{from{opacity:0}to{opacity:1}}
}
nav button{position:relative}
nav .dot{position:absolute;top:7px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--lava);box-shadow:0 0 0 2px var(--paper)}
.syncbar{display:flex;align-items:center;gap:8px;justify-content:flex-end;font-size:12.5px;color:var(--muted);font-weight:700;margin:2px 0 6px}
.syncbar button{display:inline-flex;align-items:center;gap:4px;color:var(--sea);font-weight:900;padding:4px 2px}
.syncbar svg{width:15px;height:15px}
.syncbar.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{color:var(--muted);font-weight:700;text-align:center;padding:24px 0}

/* トースト */
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:11px 16px;border-radius:10px;max-width:calc(100% - 36px);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:30;display:flex;align-items:center;gap:8px}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast.err{background:#8a2d14}
#toast svg{width:17px;height:17px}

/* 確認ダイアログ */
#dlg{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(20,24,20,.42);padding:20px}
#dlg.on{display:flex}
#dlg .dlgbox{width:100%;max-width:340px;background:var(--paper);border-radius:16px;padding:18px 18px 14px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){#dlg.on .dlgbox{animation:up .2s ease-out}@keyframes up{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}}
#dlg .tt{font-size:17px;font-weight:900;line-height:1.4}
#dlg .mm{font-size:14.5px;color:var(--muted);font-weight:700;margin-top:6px;line-height:1.55}
#dlg input{width:100%;margin-top:12px;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;font-weight:700;background:#fff}
#dlg .bt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
#dlg .bt button{padding:13px 8px;border-radius:10px;font-size:15px;font-weight:900;border:1.5px solid var(--line);background:#fff}
#dlg .bt .ok{background:var(--sea);border-color:var(--sea);color:#fff}
#dlg .bt .ok.danger{background:#8a2d14;border-color:#8a2d14}

/* ---- 使い心地 2 ---- */
.days{position:sticky;top:0;z-index:4;background:var(--bg)}
body.barOn .days{top:46px}
#topbar{position:fixed;left:0;right:0;top:0;z-index:12;background:var(--paper);border-bottom:1px solid var(--line);
  padding:0 18px;height:46px;display:none;align-items:center;gap:10px;font-size:14px;font-weight:700;
  padding-top:env(safe-area-inset-top,0px);box-sizing:content-box;width:auto;text-align:left}
#topbar.on{display:flex}
#topbar .lb{font-size:12px;color:var(--muted);font-weight:900;white-space:nowrap}
#topbar .lb.now{color:var(--lava)}
#topbar .lb.next{color:var(--sea)}
#topbar .num{font-size:21px;font-weight:800}
#topbar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:900}
#topbar .m{font-weight:900;white-space:nowrap}
#topbar .m.now{color:var(--lava)}
#topbar .m.next{color:var(--sea)}
#sheet{position:fixed;inset:0;z-index:35;display:none;align-items:flex-end;justify-content:center;background:rgba(20,24,20,.42)}
#sheet.on{display:flex}
#sheet .panel{position:relative;width:100%;max-width:560px;max-height:92%;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  box-shadow:0 -8px 40px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){#sheet.on .panel{animation:sheetup .22s ease-out}@keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}}
#sheet .hd{display:flex;align-items:center;gap:10px;padding:10px 12px 8px 18px;flex:none}
#sheet .hd::before{content:"";position:absolute;left:50%;top:7px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
#sheet .hd .tt{flex:1;font-size:17px;font-weight:900;padding-top:8px}
#sheet .hd .x{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--muted);margin-top:6px}
#sheet .hd .x svg{width:20px;height:20px}
#sheet .bd{overflow-y:auto;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
#sheet .note-form{border:0;background:transparent;padding:0 0 4px;margin:0}
#sheet .note-form input,#sheet .note-form select,#sheet .note-form textarea{background:var(--paper)}
#sheet .note-form .acts{position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px;margin-top:8px;border-top:1px solid var(--line)}
#sheet .note-form .acts .btn{flex:1;justify-content:center;padding:13px;font-size:15.5px}
body.sheetOpen{overflow:hidden}
#ptr{height:0;overflow:hidden;text-align:center;color:var(--muted);font-size:13px;font-weight:700;transition:height .15s}
#ptr.drag{transition:none}

/* 遅れ */
.plantag{display:block;font-size:11px;color:var(--muted);text-decoration:line-through;margin-top:2px;font-weight:700}
.delaybar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:0 0 10px;padding:10px 14px;border-radius:10px;
  background:#fff;border:1.5px solid var(--lava);color:var(--lava);font-weight:900;font-size:14.5px}
.delaybar span{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.delaybar small{color:var(--muted);font-weight:700;font-size:12px}
.delaybar svg{width:17px;height:17px}
.delaybar.plain{border-color:var(--line);color:var(--muted);font-size:13.5px;padding:8px 14px}
.delaybar .link{color:var(--sea);font-weight:900;white-space:nowrap}
.delayform{margin:0 0 10px;padding:14px;border-radius:12px;background:#fff;border:1.5px solid var(--lava)}
.delayform .dh{display:flex;align-items:center;gap:6px;font-weight:900;font-size:15px}
.delayform .dh svg{width:17px;height:17px;color:var(--lava)}
.delayform .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 8px}
.delayform .chips .btn{justify-content:center;padding:10px 4px}
.delayform .chips .btn[aria-pressed="true"]{background:var(--lava);border-color:var(--lava);color:#fff}
.delayform .acts{display:flex;justify-content:flex-end;margin-top:6px}

/* マスコット */
header.compact h1{display:flex;align-items:center;gap:8px}
.mascot-s{width:30px;height:30px;flex:none}
.hero-mascot{float:right;width:104px;height:104px;margin:-6px -6px 0 8px}
.end-mascot{display:block;width:120px;height:120px;margin:4px auto 6px}
.empty-mascot{display:block;width:84px;height:84px;margin:0 auto 6px;opacity:.95}

/* 端までスクロールしたら止める（上下に引っぱられて伸びる動きをなくす） */
html,body{overscroll-behavior:none}
#sheet .bd,#dlg,.scenes{overscroll-behavior:contain}

/* ---- 見やすさの設定 ---- */
/* 文字の大きさ：画面全体をまとめて拡大（ボタンや余白も一緒に大きくなる） */
html[data-size="l"] body{zoom:1.15}
html[data-size="xl"] body{zoom:1.3}
/* くっきり表示：薄い文字と線を濃く、枠を太く */
html.hc{--muted:#2a2f27;--line:#6f7766;--sea:#0a3f37;--lava:#8a5200}
html.hc .btn,html.hc .vis,html.hc .seg,html.hc .rows,html.hc .note-card,html.hc .meet,html.hc .delaybar{border-width:2px}
html.hc .it .node::before{border-left-width:3px}
html.hc .kana,html.hc .note,html.hc .where,html.hc .d,html.hc .who,html.hc .plan{color:var(--ink)}
html.hc .cnt.zero{opacity:.7}
html.hc .it.done .card{opacity:.8}
html.hc :focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* 動きを減らす */
html.calm *,html.calm *::before,html.calm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
/* 設定画面 */
.a11y .opt{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}
.a11y .opt button{padding:12px 4px;font-weight:900;background:#fff;line-height:1.2}
.a11y .opt button + button{border-left:1.5px solid var(--line)}
.a11y .opt button[aria-pressed="true"]{background:var(--sea);color:#fff}
.a11y .opt .s1{font-size:14px}.a11y .opt .s2{font-size:17px}.a11y .opt .s3{font-size:20px}
.a11y .sw{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:var(--paper)}
.a11y .sw:first-child{border-top:0}
.a11y .sw .main{flex:1;min-width:0}
.a11y .sw .t{font-weight:900;font-size:15px}
.a11y .sw .d{font-size:12.5px;color:var(--muted);font-weight:700}
.a11y .tg{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none}
.a11y .tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.a11y .sw[aria-checked="true"] .tg{background:var(--sea)}
.a11y .sw[aria-checked="true"] .tg::after{left:21px}

details.a11y{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:0 14px}
details.a11y summary{list-style:none;display:flex;align-items:center;gap:8px;padding:14px 0;font-weight:900;font-size:15px;cursor:pointer}
details.a11y summary::-webkit-details-marker{display:none}
details.a11y summary svg{width:18px;height:18px;color:var(--sea)}
details.a11y summary .sumv{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:700}
details.a11y summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 2px 0 4px;transition:transform .15s}
details.a11y[open] summary::after{transform:rotate(225deg);margin-top:4px}
details.a11y[open]{padding-bottom:14px}
details.a11y .rows{border:1px solid var(--line)}
/* 電話の確認 */
#calldlg{position:fixed;inset:0;z-index:41;display:none;align-items:center;justify-content:center;background:rgba(20,24,20,.42);padding:20px}
#calldlg.on{display:flex}
#calldlg .cbox{width:100%;max-width:340px;background:var(--paper);border-radius:16px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.25);text-align:center}
#calldlg .cn{font-size:15px;font-weight:900;color:var(--muted)}
#calldlg .cnum{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:38px;font-weight:800;letter-spacing:.02em;margin:4px 0 2px;user-select:all;-webkit-user-select:all}
#calldlg .cact{display:grid;gap:8px;margin-top:14px}
#calldlg .cact a,#calldlg .cact button{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:10px;font-size:16px;font-weight:900;text-decoration:none;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
#calldlg .cact .call{background:var(--sea);border-color:var(--sea);color:#fff}
#calldlg .cact svg{width:19px;height:19px}
#calldlg .cnote{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:10px;line-height:1.5}

/* ---- スマホの狭い画面向け ---- */
/* 日本語は語の途中で折り返さないように（対応ブラウザのみ） */
.what,.go .dest b,.nt,.ttl,.where,.sub,.nb,.dh{line-break:strict}
.hero .row2{flex-wrap:wrap}
.hero .row2 .left{margin-left:auto}
.links .btn,.btn{white-space:nowrap}
@media (max-width:430px){
  .wrap{padding-left:14px;padding-right:14px}
  .scenes{margin-left:-14px;margin-right:-14px;padding:0 14px}
  .hero .blk-now,.hero .blk-next,.hero .blk-plain{padding:14px 12px 14px 14px}
  .hero .what{font-size:23px}
  .go .dest{gap:8px}
  .go .dest .num{font-size:34px}
  .go .dest b{font-size:20px}
  .hero .left .num{font-size:28px}
  .hero .state,.go .lbl{font-size:13px}
  .hero .meet .mt{font-size:clamp(46px,15vw,64px)}
  .hero .meet .place{font-size:17px}
  .delaybar{padding:9px 12px;font-size:13.5px}
  .btn{padding:8px 10px;font-size:13.5px;gap:5px}
  .btn svg.i{width:16px;height:16px}
  .links{gap:6px}
  .it{grid-template-columns:54px 16px 1fr}
  .via{grid-template-columns:54px 16px 1fr}
  .it .time{padding-right:6px}
  .it .time .s{font-size:20px}
  .it .body{padding-left:6px}
  .it .card{padding:7px 8px}
  .it .ttl{font-size:15px}
  .row{padding:11px 12px;gap:10px}
  .row .when{width:44px;font-size:12px}
  .flight{grid-template-columns:54px 1fr auto;gap:8px}
  .note-card{padding:12px 12px 10px}
  .note-card .nt{font-size:17px}
  nav button{font-size:10.5px}
  header.compact h1{font-size:14px}
  header.compact .meta{font-size:11.5px}
}
@media (max-width:360px){
  .hero .what{font-size:21px}
  .go .dest b{font-size:18px}
  .go .dest .num{font-size:30px}
  .btn{padding:7px 8px;font-size:13px}
  nav button{font-size:10px}
}

@media (max-width:430px){
  .hero-mascot{width:84px;height:84px;margin:-4px -4px 0 6px}
  .hero .big .num{font-size:50px}
}

/* ---- 絞り込み（5等分） ---- */
.sgrid{display:grid;grid-template-columns:repeat(5,1fr);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;margin:4px 0 10px}
.sgrid button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 6px;font-size:12.5px;color:var(--muted)}
.sgrid button + button{border-left:1px solid var(--line)}
.sgrid button b{font-weight:900;white-space:nowrap}
.sgrid button .num{font-size:17px;font-weight:800;line-height:1.1;color:var(--ink)}
.sgrid button.z .num{color:var(--muted);opacity:.6}
.sgrid button[aria-pressed="true"]{background:var(--sea);color:#fff}
.sgrid button[aria-pressed="true"] .num{color:#fff;opacity:1}
.kindbar{margin:0 0 10px}

/* ---- 全体をコンパクトに（項目同士の間隔を詰める） ---- */
.hero{margin:10px 0 6px}
.hero .blk-now,.hero .blk-next,.hero .blk-plain{padding:12px 12px 12px 14px}
.hero .blk-next{margin-top:8px}
.go{margin-top:12px;padding-top:10px}
.hero .meet,.hero .meetadd,.hero .meetform{margin-top:10px}
.hero .meet{padding:12px 14px 14px}
.hero .meetadd{padding:12px}
.links{margin-top:8px;gap:6px}
.later{margin-top:8px}
.delaybar{margin:0 0 8px;padding:8px 12px}
.days{margin:12px 0 2px}
.days button{padding:7px 0 6px}
.dayhead{margin:8px 0 2px}
.via{min-height:22px}
.it .time{padding-top:6px}
.it .node i{top:12px}
.tl > :first-child .node::before{top:12px}
.tl > :last-child .node::before{height:12px}
.it .body{padding:3px 0 6px 8px}
.it .card{padding:6px 8px}
.blk{margin:14px 0}
.blk h3{margin:0 0 6px}
.row{padding:9px 12px}
.chk{padding:8px 12px}
.mem{padding:7px 12px}
.note{margin-top:6px}
.note-card{padding:11px 12px 10px;margin-bottom:8px}
.note-card .nb{margin-top:2px}
.note-card .who{margin-top:4px}
.note-card .links{margin-top:8px}
.btn{padding:6px 10px}
.write{padding:10px;margin-bottom:10px}
.sgrid{margin:2px 0 8px}
.sgrid button{padding:5px 2px 4px}
.kindbar{margin:0 0 8px}
.syncbar{margin:0 0 4px}
.counter{margin:2px 0 6px}
.counter .num{font-size:28px}
.add{margin-top:8px}
details.a11y summary{padding:11px 0}
details.a11y[open]{padding-bottom:10px}
nav button{padding:6px 0 5px}
nav button svg{width:20px;height:20px}
.wrap{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
@media (max-width:430px){
  .hero .blk-now,.hero .blk-next,.hero .blk-plain{padding:11px 10px 11px 12px}
  .btn{padding:6px 9px}
  .it .body{padding-left:5px}
}

/* ---- メモ入力シートを1画面に収める ---- */
#sheet .panel{max-height:94%}
#sheet .hd{padding:6px 8px 4px 16px}
#sheet .hd::before{top:5px}
#sheet .hd .tt{font-size:16px;padding-top:6px}
#sheet .hd .x{width:36px;height:36px;margin-top:4px}
#sheet .bd{padding:0 14px calc(10px + env(safe-area-inset-bottom,0px))}
#sheet .note-form label{margin:7px 0 3px;font-size:12px}
#sheet .note-form label:first-child{margin-top:0}
#sheet .note-form .vis button{padding:8px 4px;font-size:14px}
#sheet .note-form input,#sheet .note-form select{padding:7px 10px}
#sheet .note-form textarea{min-height:46px;padding:7px 10px;resize:none}
#sheet .note-form .acts{padding:8px 0 2px;margin-top:8px}
#sheet .note-form .acts .btn{padding:10px}
#sheet .note-form .note{margin-top:4px}

/* ---- 参加者専用の鍵 ---- */
#gate{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:var(--bg);padding:24px}
body.locked #gate{display:flex}
body.locked .wrap,body.locked nav,body.locked #topbar{visibility:hidden}
#gate .gbox{width:100%;max-width:340px;text-align:center}
#gate .gm{width:96px;height:96px}
#gate .gt{font-size:19px;font-weight:900;margin-top:8px;line-height:1.45}
#gate .gm2{font-size:14px;color:var(--muted);font-weight:700;margin-top:6px;line-height:1.6}
#gate .gpin{display:none;gap:8px;margin-top:16px}
#gate.pin .gpin{display:flex}
#gate input{flex:1;min-width:0;font-size:18px;letter-spacing:.04em;text-align:center;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:800}
#gate .gok{padding:0 18px;border-radius:10px;background:var(--sea);color:#fff;font-weight:900;font-size:16px}
#gate .gerr{color:#8a2d14;font-weight:900;font-size:13.5px;min-height:20px;margin-top:8px}

#gate .gname{display:none;width:100%;margin-top:16px;font-size:18px;text-align:center;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-weight:900;font-family:inherit}
#gate.setup .gname{display:block}
#gate.setup .gpin{margin-top:8px}

/* ---- 鍵の画面（入力しやすく） ---- */
#gate .gbox{max-width:360px}
#gate .gm{width:84px;height:84px}
#gate .gform{display:none;text-align:left;margin-top:18px}
#gate.pin .gform{display:block}
#gate .glab{display:block;font-size:12.5px;font-weight:900;color:var(--muted);margin:12px 0 4px}
#gate .glab:first-child{margin-top:0}
#gate .gname-l,#gate .gname{display:none}
#gate.setup .gname-l,#gate.setup .gname{display:block}
#gate .gname{margin-top:0;text-align:left;font-size:17px}
#gate .gpin{display:flex;position:relative;margin-top:0}
#gate.setup .gpin{margin-top:0}
#gate .gpin input{text-align:left;font-family:inherit;font-size:17px;font-weight:900;letter-spacing:.02em;padding:11px 48px 11px 12px}
#gate .geye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
#gate .geye svg{width:20px;height:20px}
#gate .geye[aria-pressed="true"]{color:var(--sea)}
#gate .gok{display:block;width:100%;margin-top:16px;padding:14px;font-size:16.5px;border-radius:12px}
#gate .gerr{text-align:left}
/* ---- ボタンを押しやすい高さに ---- */
.btn{min-height:38px}
.links .btn{min-height:38px}
/* ---- 済んだ予定は薄く ---- */
.it.done .time,.it.done .node i{opacity:.5}
.loading-s{color:var(--muted);font-weight:700;font-size:13.5px;padding:10px 12px}

/* 開いた直後から鍵の画面を表示（中身は確認が済むまで描かない） */
body.locked .wrap,body.locked nav,body.locked #topbar,body.locked #sheet{display:none!important}
#gate .gspin{width:28px;height:28px;margin:14px auto 0;border:3px solid var(--line);border-top-color:var(--sea);border-radius:50%;animation:spin .8s linear infinite;display:none}
#gate.checking .gspin{display:block}

/* ---- 下のメニューを押しやすく（ホーム画面から開いたときも） ---- */
nav{padding-bottom:max(env(safe-area-inset-bottom,0px),6px)}
nav button{padding:10px 0 8px;font-size:11.5px;gap:3px;min-height:58px;justify-content:center}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{border-top-width:3px}
/* ホーム画面から開いたとき：画面下のバー（ホームインジケーター）とぶつからないよう余白を足す */
body.standalone nav{padding-bottom:max(env(safe-area-inset-bottom,0px),22px)}
body.standalone .wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media (max-width:360px){nav button{font-size:10.5px}nav button svg{width:22px;height:22px}}
#toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
body.standalone #toast{bottom:calc(108px + env(safe-area-inset-bottom,0px))}

/* ---- 下のメニューを深緑のバーに（中身との境目をはっきり） ---- */
nav{background:var(--sea);border-top:0;box-shadow:0 -2px 10px rgba(15,82,72,.18)}
nav button{color:rgba(255,255,255,.72);border-top-color:transparent}
nav button[aria-current="page"]{color:#fff;border-top-color:var(--lava-on-sea,#f0b54a)}
nav button:active{opacity:.75}
nav .dot{background:#f0b54a;box-shadow:0 0 0 2px var(--sea)}
html.hc nav button{color:rgba(255,255,255,.9)}
html.hc nav button[aria-current="page"]{color:#fff;text-decoration:underline;text-underline-offset:3px}

/* ---- 下のメニューのアイコンと文字をひと回り大きく ---- */
nav button{font-size:12.5px;gap:4px;min-height:64px;padding:10px 0 9px;letter-spacing:-.02em}
nav button svg{width:28px;height:28px;stroke-width:1.9}
nav .dot{top:7px;left:calc(50% + 11px);width:9px;height:9px}
.wrap{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
body.standalone .wrap{padding-bottom:calc(106px + env(safe-area-inset-bottom,0px))}
#toast{bottom:calc(98px + env(safe-area-inset-bottom,0px))}
body.standalone #toast{bottom:calc(114px + env(safe-area-inset-bottom,0px))}
@media (max-width:380px){nav button{font-size:11.5px;letter-spacing:-.04em}nav button svg{width:26px;height:26px}}
@media (max-width:340px){nav button{font-size:10.5px}nav button svg{width:24px;height:24px}}

.scenehead{display:flex;align-items:baseline;gap:8px;font-size:13.5px;font-weight:900;color:var(--sea);margin:14px 2px 6px;padding-bottom:4px;border-bottom:1.5px solid var(--line)}
.scenehead:first-child{margin-top:4px}
.scenehead .num{font-size:15px;color:var(--muted)}

details.memfold .sumv .num{font-size:15px;color:var(--ink);font-weight:800}

/* 持ち物の候補 */
.hints{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.hints .hl{font-size:12.5px;color:var(--muted);font-weight:900;margin-right:2px}
.hint{display:inline-flex;align-items:center;gap:3px;padding:6px 10px;border:1.5px dashed var(--line);border-radius:8px;font-size:13px;font-weight:700;color:var(--ink);background:transparent;min-height:34px}
.hint svg{width:14px;height:14px;color:var(--sea)}

/* 天気（1行のコンパクト表示） */
.wxcard{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border:1px solid var(--line);border-radius:10px;margin:0 0 8px;overflow:hidden}
.wxcol{padding:6px 6px 5px;border-left:1px solid var(--line);min-width:0}
.wxcol:first-child{border-left:0}
.wxcol.today{background:var(--lava-soft)}
.wxd{font-size:11px;font-weight:900;color:var(--muted);line-height:1.2;white-space:nowrap}
.wxd span{margin-left:4px;color:var(--ink)}
.wxm{display:flex;align-items:center;gap:5px;margin-top:2px;white-space:nowrap}
.wxi{width:20px;height:20px;color:var(--sea);flex:none}
.wxt{font-size:13px;color:var(--muted);font-weight:700}
.wxt b{font-size:16px;color:var(--ink);font-weight:800}
.wxr{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);font-weight:700;margin-left:auto}
.wxr svg{width:12px;height:12px}
@media (max-width:360px){.wxt b{font-size:14px}.wxr{font-size:10.5px}}
.btn.album{width:100%;justify-content:center;padding:12px;border-color:var(--sea);color:var(--sea)}

/* 共有アルバムへの細いバー（日程タブ） */
.albumbar{display:flex;align-items:center;gap:8px;margin:14px 0 4px;padding:9px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line);text-decoration:none;font-size:13.5px}
.albumbar svg{width:18px;height:18px;color:var(--sea);flex:none}
.albumbar svg:last-child{width:15px;height:15px;color:var(--muted)}
.albumbar b{font-weight:900}
.albumbar span{flex:1;color:var(--muted);font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* パスワードなしの運用：パスワード欄を出さない */
#gate.nopass .gpin-l,#gate.nopass .gpin{display:none}

/* 合言葉なしのアドレスで開いているときの案内 */
.fixbar{display:flex;align-items:flex-start;gap:8px;margin:0 0 10px;padding:10px 12px;border-radius:10px;background:#fff;border:1.5px solid var(--sea);color:var(--ink);text-decoration:none;font-size:13px;line-height:1.5}
.fixbar svg{width:18px;height:18px;color:var(--sea);flex:none;margin-top:2px}
.fixbar b{color:var(--sea)}
.fixbar.strong{background:var(--lava-soft);border-color:var(--lava)}
.fixbar.strong b,.fixbar.strong svg{color:var(--lava)}

/* 天気カード（押せる） */
button.wxcard{width:100%;text-align:left;padding:0;font:inherit;color:inherit;position:relative;padding-right:22px}
.wxmore{position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--muted);display:grid;place-items:center}
.wxmore svg{width:16px;height:16px}
/* 天気の詳細シート */
#wxsheet{position:fixed;inset:0;z-index:35;display:none;align-items:flex-end;justify-content:center;background:rgba(20,24,20,.42)}
#wxsheet.on{display:flex}
#wxsheet .panel{position:relative;width:100%;max-width:560px;max-height:92%;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){#wxsheet.on .panel{animation:sheetup .22s ease-out}}
#wxsheet .hd{display:flex;align-items:center;gap:10px;padding:6px 8px 4px 16px;flex:none}
#wxsheet .hd::before{content:"";position:absolute;left:50%;top:5px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
#wxsheet .hd .tt{flex:1;font-size:16px;font-weight:900;padding-top:6px}
#wxsheet .hd .x{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted);margin-top:4px}
#wxsheet .hd .x svg{width:20px;height:20px}
#wxsheet .bd{overflow-y:auto;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.wxday{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.wxday.today{border-color:var(--lava);box-shadow:0 0 0 2px var(--lava-soft)}
.wxdh{display:flex;align-items:center;gap:10px}
.wxbig{width:38px;height:38px;color:var(--sea)}
.wxdt{font-size:15px;font-weight:900}
.wxds{font-size:13px;color:var(--muted);font-weight:700}
.wxdtemp{margin-left:auto;text-align:right;line-height:1.05}
.wxdtemp b{font-size:26px;font-weight:800;display:block}
.wxdtemp span{font-size:15px;color:var(--muted);font-weight:700}
.wxstats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:13px}
.wxstats div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.wxstats div:last-child{grid-column:1 / -1}
.wxstats span{color:var(--muted);font-weight:700}
.wxstats b{font-weight:800}
.wxhours{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin-top:10px;text-align:center}
.wxh{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--muted);font-weight:700;padding:4px 0;border-radius:6px;background:var(--bg)}
.wxh svg{width:18px;height:18px;color:var(--sea)}
.wxh b{font-size:15px;color:var(--ink);font-weight:800}
.wxhr{font-size:11px}
.wxdress{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--lava-soft)}
.wxdl{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:900;color:var(--lava)}
.wxdl svg{width:16px;height:16px}
.wxdress ul{margin:4px 0 0;padding-left:1.2em;font-size:13.5px;line-height:1.55}
.wxday .link{display:inline-block;margin-top:8px;font-size:13px}

/* 地図 */
#daymap-wrap{margin:6px 0 4px}
.maphead{display:flex;justify-content:space-between;align-items:center;margin:0 2px 6px}
.maphead .link{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:900}
.maphead svg{width:15px;height:15px}
#daymap{height:190px;border-radius:12px;border:1px solid var(--line);overflow:hidden;z-index:0}
.mk span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #0f5248;color:#0f5248;font:800 13px "Barlow Condensed",sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.mk.next span{background:#0f5248;color:#fff}
.mk.now span{background:#b06f00;border-color:#b06f00;color:#fff;box-shadow:0 0 0 5px rgba(196,128,15,.25)}
.mk.done span{opacity:.5}
.leaflet-container{font-family:inherit}
/* 方言 */
/* 旅のコラム（ボタン） */
.colbar{display:flex;align-items:center;gap:8px;width:100%;margin:14px 0 0;padding:10px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--line);text-align:left;font-size:13.5px}
.colbar svg{width:18px;height:18px;color:var(--sea);flex:none}
.colbar svg:last-child{width:15px;height:15px;color:var(--muted)}
.colbar b{font-weight:900;flex:none}
.colbar span{flex:1;color:var(--muted);font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.colitem{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-bottom:8px}
.colitem summary{list-style:none;cursor:pointer;padding:12px 0;font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
.colitem summary::-webkit-details-marker{display:none}
.colitem summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;transition:transform .15s}
.colitem[open] summary::after{transform:rotate(-135deg)}
.colitem p{margin:0 0 10px;font-size:14px;line-height:1.7}
.colitem[open]{padding-bottom:4px}
/* 見どころ */
.spotinfo{margin:8px 0 2px;padding:8px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
.hero .spotinfo{background:rgba(255,255,255,.7)}
.sih{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:900;color:var(--sea)}
.sih svg{width:14px;height:14px}
.spotinfo ul{margin:3px 0 0;padding-left:1.15em;font-size:13px;line-height:1.55}

#daymap{height:200px}



.dlgch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.dlgch button{padding:13px 8px;border-radius:10px;font-size:14.5px;font-weight:900;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.dlgch button:active{background:var(--sea);color:#fff}



#dlg input[type=time]{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:24px;font-weight:800;text-align:center;letter-spacing:.02em}

.dlgch{grid-template-columns:1fr}

#dlg input[type=time]{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:24px;font-weight:800;text-align:center;letter-spacing:.02em}

.dlgch{grid-template-columns:1fr}

/* ---- 仕上げ：上部カードは大胆に、帯はそろえて、枠は控えめに ---- */
.hero .what{font-size:28px;line-height:1.25;letter-spacing:.005em}
.hero .blk-now,.hero .blk-next,.hero .blk-plain{border-radius:4px 14px 14px 4px}
.hero .left .num{font-size:36px;letter-spacing:-.01em}
.go .dest .num{font-size:42px}
.go .dest b{font-size:23px}
.spotinfo{border:0;background:rgba(255,255,255,.55);padding:9px 11px}
.hero .blk-next .spotinfo{background:rgba(255,255,255,.55)}
.spotinfo li.tag{list-style:none;margin-left:-1.15em;padding-left:0;margin-top:3px}
.spotinfo .tg{display:inline-block;font-size:11px;font-weight:900;color:var(--sea);border:1px solid var(--sea);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px;line-height:1.5}
/* 日程タブの上部の帯：高さ・角丸・余白をそろえる */
.wxcard,#daymap,.albumbar{border-radius:12px}
.wxcard{margin-bottom:6px}
#daymap-wrap{margin:8px 0 6px}
.maphead{margin-bottom:6px}
/* 日付タブ：薄い帯の上に */
.days{border-bottom:0;background:var(--bg);padding-top:2px}
.days button{font-size:14px}
.days button[aria-selected="true"]{border-bottom-width:3px}
/* 枠線を控えめに、角丸を統一 */
.rows,.note-card,.recap,.wxday,.nlist{border-color:rgba(20,24,20,.09)}
.note-card{box-shadow:0 1px 2px rgba(20,24,20,.05)}
.btn{border-color:rgba(20,24,20,.16)}
/* アイコンの線の太さを統一 */
svg.i{stroke-width:1.9}
nav button svg{stroke-width:1.8}
.btn svg.i{stroke-width:2}
@media (max-width:430px){
  .hero .what{font-size:24px}
  .hero .left .num{font-size:30px}
  .go .dest .num{font-size:36px}
  .go .dest b{font-size:20px}
}

.delayform .chlab{font-size:12px;font-weight:900;color:var(--muted);margin:8px 0 4px}
.delayform .chips{margin:0}
.delayform .chips.four{grid-template-columns:repeat(4,1fr)}
.delayform .chips.one{grid-template-columns:1fr;margin-top:8px}
.delaybar.early{border-color:var(--sea);color:var(--sea)}

/* 投稿ボタン：しっかり押せる見た目に */
.write.solid{border:0;background:var(--sea);color:#fff;font-weight:900;font-size:15.5px;padding:13px;box-shadow:0 3px 10px rgba(15,82,72,.25)}
.write.solid svg{color:#fff}
.write.solid:active{opacity:.85}
/* 右下の投稿ボタン（みんなのメモを開いているとき） */
#fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:11;display:none;align-items:center;gap:6px;
  padding:0 18px 0 14px;height:52px;border-radius:26px;background:var(--sea);color:#fff;font-weight:900;font-size:15px;box-shadow:0 6px 18px rgba(15,82,72,.35)}
#fab svg{width:22px;height:22px;stroke-width:2}
body.onnotes:not(.locked):not(.sheetOpen) #fab{display:flex}
body.standalone #fab{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
#fab:active{transform:scale(.96)}





.colitem summary .cn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sea);color:var(--sea);font-size:12px;font-weight:800;flex:none}
.colitem[open] summary .cn{background:var(--sea);color:#fff}

/* アルバムとコラム：小さなボタン2つ */
.extras{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 4px}
.extras.one{grid-template-columns:1fr}
.exbtn{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 8px;border-radius:12px;background:var(--paper);border:1px solid var(--line);color:var(--ink);text-decoration:none;font:inherit;font-size:14px;font-weight:900}
.exbtn svg{width:18px;height:18px;color:var(--sea)}
.exbtn:active{background:var(--bg)}

/* 上部カードの見どころ：たたんでおく */
.spotinfo.fold{padding:0 11px}
.spotinfo.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:5px;padding:7px 0;font-size:12.5px;font-weight:900;color:var(--sea)}
.spotinfo.fold summary::-webkit-details-marker{display:none}
.spotinfo.fold summary svg{width:14px;height:14px}
.spotinfo.fold .sc{font-size:12px;color:var(--muted);font-weight:800;margin-left:2px}
.spotinfo.fold summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;margin-top:-3px;transition:transform .15s}
.spotinfo.fold[open] summary::after{transform:rotate(-135deg);margin-top:3px}
.spotinfo.fold ul{margin:0 0 8px}

/* ---- 下のメニュー：字とマークを大きく ---- */
nav button{font-size:12.5px;min-height:62px;padding:8px 0 8px;gap:3px;letter-spacing:0}
nav button svg,nav button svg.i{width:25px;height:25px;stroke-width:1.9}
nav .dot{top:7px;left:calc(50% + 10px);width:9px;height:9px}
.wrap{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
body.standalone .wrap{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
#toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body.standalone #toast{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
#fab{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
body.standalone #fab{bottom:calc(102px + env(safe-area-inset-bottom,0px))}
@media (max-width:340px){nav button{font-size:11.5px}nav button svg,nav button svg.i{width:23px;height:23px}}
/* ---- 押しやすさ ---- */
button,a,summary,[data-toggle]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn,.links .btn{min-height:42px}
.link{padding:6px 2px;margin:-6px -2px}
.btn:active,.exbtn:active,.tonight:active{transform:scale(.97)}
.it .card:active{background:rgba(15,82,72,.05)}
nav button:active svg{transform:scale(.9)}
@media (prefers-reduced-motion:reduce){.btn:active,.exbtn:active,.tonight:active,nav button:active svg{transform:none}}
/* ---- 電波がないとき ---- */
.offline{display:flex;align-items:center;gap:6px;margin:0 0 8px;padding:7px 10px;border-radius:8px;background:#f3f1ea;color:var(--muted);font-size:12.5px;font-weight:700}
.offline svg{width:15px;height:15px;flex:none}

/* 日ごとの天気カード */
.wxday1{display:block;width:100%;text-align:left;font:inherit;color:inherit;margin:8px 0 6px;padding:10px 12px 9px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
.wxsegs{display:grid;grid-template-columns:1fr;gap:6px}
.wxsegs.two{grid-template-columns:1fr 1fr}
.wxseg{display:flex;align-items:center;gap:8px;min-width:0}
.wxseg .wxi{width:32px;height:32px;color:var(--sea);flex:none}
.wxsm{min-width:0}
.wxcity{font-size:12px;font-weight:900;color:var(--muted)}
.wxcity span{margin-left:6px;color:var(--ink)}
.wxnums{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.wxnums .wxt{font-size:13px;color:var(--muted);font-weight:700}
.wxnums .wxt b{font-size:19px;color:var(--ink);font-weight:800}
.wxnums .wxr{margin-left:0}
.wxhrow{display:grid;grid-template-columns:repeat(6,1fr);margin-top:8px;padding-top:7px;border-top:1px dashed var(--line)}
.wxhh{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted);font-weight:700}
.wxhh i{font-style:normal}
.wxhh svg{width:16px;height:16px;color:var(--sea)}
.wxhh b{font-size:13.5px;color:var(--ink);font-weight:800}
.wxtip{display:flex;align-items:center;gap:6px;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:12.5px;font-weight:700}
.wxtip svg{width:15px;height:15px;color:var(--lava);flex:none}
.wxtip>span:first-of-type{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wxgo{display:inline-flex;align-items:center;color:var(--sea);font-weight:900;flex:none}
.wxgo svg{width:13px;height:13px;color:var(--sea)}
.wxday1:active{background:var(--bg)}

/* 3日分の天気：1列ずつ押せる */
div.wxcard{padding-right:0}
.wxcard .wxcol{font:inherit;color:inherit;text-align:left;background:transparent;border:0;border-left:1px solid var(--line);position:relative}
.wxcard .wxcol:first-child{border-left:0}
.wxcard .wxcol.today{background:var(--lava-soft)}
.wxcard .wxcol:active{background:var(--bg)}
.wxcard .wxcol::after{content:"";position:absolute;right:6px;top:9px;width:5px;height:5px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);opacity:.7}

.wxcard .wxcol{padding:6px 7px 6px;min-width:0;overflow:hidden;font-size:13px}
.wxcard .wxm{gap:4px}
.wxcard .wxi,.wxcard svg.i.wxi{width:20px;height:20px}
.wxcard .wxt{font-size:12px}
.wxcard .wxt b{font-size:16px}
.wxcard .wxr{font-size:11px;gap:1px}
.wxcard .wxr svg,.wxcard .wxr svg.i{width:11px;height:11px}
@media (max-width:360px){.wxcard .wxt b{font-size:14px}.wxcard .wxr{font-size:10px}}

.wxcard .wxd{display:flex;align-items:center;gap:0}
.wxcard .wxd .wxr{margin-left:auto;font-size:11px;color:var(--muted)}
.wxcard .wxcol::after{display:none}
.wxcard .wxgo2{margin-left:auto;color:var(--muted);display:grid;place-items:center}
.wxcard .wxgo2 svg,.wxcard .wxgo2 svg.i{width:13px;height:13px}

/* 連絡事項 */
.notice{margin:0 0 10px;padding:8px 8px 10px 12px;border-radius:4px 12px 12px 4px;background:#fff;border-left:5px solid var(--sea);box-shadow:0 1px 4px rgba(15,82,72,.12)}
.notice .nh{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:900;color:var(--sea)}
.notice .nh svg{width:15px;height:15px}
.notice .nu{color:var(--muted);font-weight:800;font-size:12px}
.notice .nx{margin-left:auto;width:30px;height:30px;display:grid;place-items:center;color:var(--muted);margin-top:-4px;margin-right:-2px}
.notice .nx svg{width:15px;height:15px}
.notice .nt{font-size:15px;font-weight:800;line-height:1.5;margin-top:1px}
.orgline{display:flex;justify-content:flex-end;margin:2px 0 4px}
.orgline .link{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:700;text-decoration:none;padding:4px 2px}
.orgline .link svg{width:13px;height:13px}
/* 終わった日のメモ */
.pastnotes{margin-top:14px;border-top:1px dashed var(--line);padding-top:6px}
.pastnotes>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:8px 2px;font-size:13px;font-weight:900;color:var(--muted)}
.pastnotes>summary::-webkit-details-marker{display:none}
.pastnotes>summary .num{font-size:13px}
.pastnotes>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;margin-top:-3px}
.pastnotes[open]>summary::after{transform:rotate(-135deg);margin-top:3px}
.pastnotes .note-card{opacity:.75}

.maphead .mapr{display:inline-flex;gap:14px;align-items:center}

/* 地図の全画面 */
.mapfullbar{display:none}
#daymap-wrap.full{position:fixed;inset:0;z-index:40;margin:0;background:var(--bg);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#daymap-wrap.full .maphead{order:2;margin:8px 14px;justify-content:flex-end}
#daymap-wrap.full .maphead [data-mapt],#daymap-wrap.full #mapfull{display:none}
#daymap-wrap.full .mapfullbar{display:flex;order:0;align-items:center;gap:10px;padding:10px 8px 8px 16px;font-size:16px}
#daymap-wrap.full .mapfullbar b{flex:1;font-weight:900}
#daymap-wrap.full .mfx{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
#daymap-wrap.full .mfx svg{width:20px;height:20px}
#daymap-wrap.full #daymap{order:1;flex:1;height:auto;border-radius:0;border-left:0;border-right:0}
body.mapFull{overflow:hidden}
body.mapFull nav,body.mapFull #fab,body.mapFull #topbar{display:none!important}

/* ================= タイムテーブル（時刻｜丸アイコン｜白いカード） ================= */
.tl{margin-top:10px}
.it,.via{grid-template-columns:66px 40px 1fr}
.it .time{padding:16px 8px 0 0;text-align:right;line-height:1.1;white-space:nowrap}
.it .time .s{font-size:18px;font-weight:800;letter-spacing:-.02em}
.it .time .e{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:3px}
/* 縦の線と丸アイコン */
.it .node{width:40px}
.it .node::before{left:19px;border-left:2px solid #d8dcd2}
.tl > :first-child .node::before{top:22px}
.tl > :last-child .node::before{height:22px}
.it .node i{left:3px;top:10px;width:34px;height:34px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;box-shadow:0 0 0 3px var(--bg)}
.it .node i svg{width:17px;height:17px;stroke-width:2}
.it.k-gather .node i{background:var(--sea)}
.it.k-meal .node i{background:#c4800f}
.it.k-spot .node i{background:#8a6a2b}
.it.k-hotel .node i{background:#4f5648}
.it.k-stop .node i,.it.k-rest .node i{background:#7b8174}
.it.k-flight .node i,.it.k-ferry .node i{background:var(--ink)}
.it.now .node i{box-shadow:0 0 0 3px var(--bg),0 0 0 6px rgba(196,128,15,.45)}
.it.off .node i{background:var(--bg);color:var(--muted);border:1.5px dashed #b9bfb1}
/* 白いカード（中身を開くとカードの中に広がる） */
.it .body{margin:4px 0 12px 6px;padding:0;background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(20,24,20,.07),0 0 0 1px rgba(20,24,20,.05);overflow:hidden;min-width:0}
.it .card{position:relative;padding:12px 40px 12px 14px;border-radius:0;background:transparent!important}
.it .kind{gap:6px;font-size:12px;font-weight:900;color:var(--muted)}
.it .kind .kl{letter-spacing:.02em}
.it.k-gather .kind .kl{color:var(--sea)}
.it.k-meal .kind .kl{color:#b06f00}
.it.k-spot .kind .kl{color:#8a6a2b}
.it .ttl{font-size:17px;margin-top:2px;line-height:1.4}
.it .sub{font-size:13.5px;margin-top:1px;line-height:1.5}
.it .badge{margin-left:auto;font-size:11.5px;font-weight:900;padding:2px 9px;border-radius:999px;letter-spacing:.06em;line-height:1.5}
.it .badge.now{background:#b06f00;color:#fff}
.it .badge.next{background:var(--ink);color:#fff}
.it .badge.off{background:transparent;color:var(--muted);padding-right:0}
.it .chev{position:absolute;right:12px;bottom:12px;color:#a7ad9f;display:grid;place-items:center;transition:transform .15s}
.it .chev svg{width:16px;height:16px;transform:rotate(90deg)}
.it.open .chev{transform:rotate(180deg)}
.it .detail{padding:0 14px 12px;border-top:1px solid var(--line);margin-top:0}
.it.open .detail{padding-top:10px}
/* いま・つぎ・済み・別ルート */
.it.now .body{box-shadow:0 0 0 2.5px var(--ink),0 4px 12px rgba(20,24,20,.12)}
.it.now .card{background:transparent!important}
.it.nexti .body{box-shadow:0 0 0 1.5px var(--sea),0 2px 8px rgba(15,82,72,.12)}
.it.nexti .card{background:transparent!important}
.it.done .body{opacity:.6}
.it.done .card{opacity:1}
.it.off{opacity:1}
.it.off .body{background:transparent;box-shadow:none;border:1.5px dashed #c7ccbf}
.it.off .ttl,.it.off .sub,.it.off .time{opacity:.75}
/* 移動（バス・徒歩など）の行 */
.via{min-height:34px}
.via .rail{border-left:2px dashed #cdd2c6;justify-self:center}
.via .lbl{padding-left:12px;font-size:13px;font-weight:700}
.via .lbl svg{width:16px;height:16px}
@media (max-width:360px){.it,.via{grid-template-columns:58px 36px 1fr}.it .node{width:36px}.it .node::before{left:17px}.it .node i{width:30px;height:30px}.it .time .s{font-size:17px}}

.appver{text-align:center;font-size:11.5px;color:var(--muted);margin:18px 0 6px}

/* カードを開いたとき：見どころとタイトルの間を詰める */
.it .detail{border-top:1px solid #eceee8}
.it.open .detail{padding-top:8px}
.it .detail .spotinfo{margin:0 0 4px;padding:0;background:transparent;border:0}
.it .detail .spotinfo .sih{margin:0}
.it .detail .spotinfo ul{margin-top:2px}

.it .detail .dlab{margin:10px 0 4px!important}
.it .detail .dlab+*{margin-top:0}
.it .detail .meetcard,.it .detail .meetbtn{margin-top:0}

/* 自分だけのメモ：見出し・入力欄・下の余白を詰める */
.it .detail textarea{display:block;margin:0;min-height:64px}
.it .detail .saved{min-height:0;margin:3px 0 0;font-size:12px}
.it .detail .saved:empty{display:none}
.it.open .detail{padding-bottom:12px}

/* 地図の見た目 */
#daymap{background:#eef0ea}
#daymap .leaflet-tile-pane{filter:saturate(.85) contrast(.97)}
.mk span{width:28px;height:28px;font-size:13.5px;border-width:2.5px;box-shadow:0 2px 6px rgba(20,24,20,.25)}
.mk.done span{background:#f3f4ef;border-color:#9aa093;color:#7b8174;opacity:1}
.mklabel{background:#fff;border:0;border-radius:8px;box-shadow:0 2px 8px rgba(20,24,20,.18);padding:3px 8px;font:800 12.5px/1.4 inherit;color:var(--ink);white-space:nowrap}
.mklabel b{font-size:11px;margin-right:5px}
.mklabel.now b{color:#b06f00}
.mklabel.next b{color:var(--sea)}
.mklabel::before{display:none}
.leaflet-control-zoom{border:0!important;box-shadow:0 2px 8px rgba(20,24,20,.18)!important;border-radius:10px!important;overflow:hidden}
.leaflet-control-zoom a{width:34px!important;height:34px!important;line-height:34px!important;color:var(--ink)!important}
#daymap:not(.big) .leaflet-control-zoom{display:none}
#daymap-wrap.full .leaflet-control-zoom{display:block}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.75)!important}

.leaflet-tooltip-left.mklabel{margin-left:-18px}
.leaflet-tooltip-right.mklabel{margin-left:18px}

/* パンフレット */
.pamarea{font-size:12px;font-weight:900;color:var(--muted);margin:10px 2px 6px;letter-spacing:.06em}
.pamgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pam{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px}
.pam img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;border-radius:6px;background:#eef0ea;display:block}
.pam .pt{font-size:13.5px;font-weight:900;line-height:1.35;margin-top:3px}
.pam .pd{font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.45}
.pam .pm{font-size:11px;color:var(--muted);margin-top:auto}
.pam:active{background:var(--bg)}
.links .pambtn svg{color:var(--sea)}

.pamfold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:2px 0}
.pamfold>summary::-webkit-details-marker{display:none}
.pamfold>summary h3{margin:0}
.pamfold>summary .pc{font-size:12px;color:var(--muted);font-weight:800}
.pamfold>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;margin-top:-4px;transition:transform .15s}
.pamfold[open]>summary::after{transform:rotate(-135deg);margin-top:4px}

/* 予定カードの中のパンフレット：表紙つきで目立たせる */
.pamrows{display:grid;gap:8px;margin:10px 0 2px}
.pamrow{display:flex;align-items:center;gap:11px;padding:8px 10px 8px 8px;border-radius:12px;background:#fbf7ee;border:1px solid #e6dcc5;text-decoration:none;color:var(--ink)}
.pamrow img{width:46px;height:58px;object-fit:cover;object-position:top;border-radius:4px;box-shadow:0 1px 3px rgba(20,24,20,.2);flex:none;background:#fff}
.pamrow .pr-t{display:flex;flex-direction:column;min-width:0;flex:1}
.pamrow i{font-style:normal;font-size:11px;font-weight:900;color:#b06f00;letter-spacing:.06em}
.pamrow b{font-size:14.5px;font-weight:900;line-height:1.35}
.pamrow em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pamrow>svg{width:16px;height:16px;color:#b06f00;flex:none}
.pamrow:active{background:#f3ecdc}

.pamrows{grid-template-columns:minmax(0,1fr)}
.pamrow{min-width:0;overflow:hidden}

.pamfold .pamrows{margin:0}
.pamfold .pamarea{margin:12px 2px 6px}

/* 情報タブ：パンフレット置き場の入口（押せるカードに） */
.pamfold>summary{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:14px;background:#fbf7ee;border:1px solid #e6dcc5;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.pamfold>summary::after{display:none!important}
.pamfold>summary:active{background:#f3ecdc}
.pamfold .pf-covers{position:relative;width:70px;height:60px;flex:none}
.pamfold .pf-covers img{position:absolute;top:2px;width:42px;height:56px;object-fit:cover;object-position:top;border-radius:4px;box-shadow:0 1px 4px rgba(20,24,20,.25);background:#fff}
.pamfold .pf-covers img:nth-child(1){left:0;transform:rotate(-7deg)}
.pamfold .pf-covers img:nth-child(2){left:14px;transform:rotate(1deg);z-index:1}
.pamfold .pf-covers img:nth-child(3){left:28px;transform:rotate(7deg);z-index:2}
.pamfold .pr-t{display:flex;flex-direction:column;min-width:0;flex:1}
.pamfold .pr-t i{font-style:normal;font-size:11px;font-weight:900;color:#b06f00;letter-spacing:.06em}
.pamfold .pr-t b{font-size:16px;font-weight:900;line-height:1.35}
.pamfold .pr-t em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.4}
.pamfold .pf-chev{color:#b06f00;display:grid;place-items:center;transition:transform .15s;flex:none}
.pamfold .pf-chev svg{width:18px;height:18px;transform:rotate(90deg)}
.pamfold[open] .pf-chev{transform:rotate(180deg)}

.pamfold .pf-covers{margin-left:4px;width:74px}
.pamfold>summary{padding-left:12px}
</style>
</head>
<body class="locked">
<div class="wrap">
  <div class="hero" id="hero" role="region" aria-label="いま・つぎ"></div>

/* 開いたものが、画面（またはシート）の中央に全体で見えるように動かす。
   全体が入りきらない長さなら、頭が見える位置にそろえる */
function reveal(el){
  if(!el) return;
  const box=el.closest('.bd')||null;
  /* 画面の上に貼りついている帯（つぎの帯・日付タブ）の下からを見える範囲とする */
  let stick=0;
  if(!box) document.querySelectorAll('#days,#mini,.minibar,.stickybar').forEach(s=>{const cs=getComputedStyle(s);if(cs.position==='sticky'||cs.position==='fixed'){const r=s.getBoundingClientRect();if(r.top<=2&&r.bottom>0)stick=Math.max(stick,r.bottom);}});
  if(!box){const dz=document.getElementById('days');if(dz){const cs=getComputedStyle(dz);if(cs.position==='sticky')stick=Math.max(stick,parseFloat(cs.top||0)+dz.offsetHeight);}}
  const vh=box?box.clientHeight:(window.innerHeight-(document.querySelector('nav')?.offsetHeight||0)-stick);
  const top0=box?box.getBoundingClientRect().top:stick;
  const r=el.getBoundingClientRect(), h=r.height, top=r.top-top0;
  let delta;
  if(h<=vh-24) delta=top-(vh-h)/2;     /* 収まる：中央に */
  else delta=top-12;                   /* 収まらない：頭を上に */
  if(Math.abs(delta)<4) return;
  if(box) box.scrollBy({top:delta,behavior:SB()}); else window.scrollBy({top:delta,behavior:SB()});
}

let toastTimer;
function toast(msg,kind){

  el.className=kind==='err'?'err':'';
  el.innerHTML=(kind==='err'?ic('info'):ic('check'))+'<span>'+esc(msg)+'</span>';

function ask({title,msg='',ok='OK',cancel='キャンセル',danger=false,input=null,choices=null}){
  return new Promise(res=>{
    const d=document.getElementById('dlg'), i=document.getElementById('dlg-i'), ch=document.getElementById('dlg-ch');
    ch.innerHTML=choices?choices.map(c=>`<button data-choice="${esc(String(c.v))}">${esc(c.label)}</button>`).join(''):'';
    ch.style.display=choices?'grid':'none';
    document.getElementById('dlg-o').style.display=choices?'none':'';
    document.getElementById('dlg-t').textContent=title;
    document.getElementById('dlg-m').textContent=msg;
    const o=document.getElementById('dlg-o'), c=document.getElementById('dlg-c');
    o.textContent=ok; c.textContent=cancel; o.classList.toggle('danger',danger);
    if(input){i.style.display='';i.type=input.type||'text';i.value=input.value||'';i.placeholder=input.placeholder||'';}
    else i.style.display='none';
    const done=v=>{d.classList.remove('on');o.onclick=c.onclick=d.onclick=i.onkeydown=document.onkeydown=ch.onclick=null;res(v);};
    ch.onclick=e=>{const b=e.target.closest('[data-choice]'); if(b) done(b.getAttribute('data-choice'));};
    o.onclick=()=>done(input?i.value.trim():true);
    c.onclick=()=>done((input||choices)?null:false);
    d.onclick=e=>{if(e.target===d) done(input?null:false);};
    i.onkeydown=e=>{if(e.key==='Enter') o.click();};
    document.onkeydown=e=>{if(e.key==='Escape') c.click();};
    d.classList.add('on');
    setTimeout(()=>(input?i:o).focus(),30);
  });
}

function openCall(name,num){
  const d=document.getElementById('calldlg'), tel='tel:'+num.replace(/[^0-9+]/g,'');
  document.getElementById('call-n').textContent=name||'電話';
  document.getElementById('call-num').textContent=num;
  const go=document.getElementById('call-go'); go.href=tel; go.innerHTML=ic('phone')+'電話をかける';
  const cp=document.getElementById('call-copy'); cp.innerHTML=ic('copy')+'番号をコピー';
  const close=()=>{d.classList.remove('on');document.onkeydown=null;};
  go.onclick=e=>{
    /* GASの枠の中では、まず新しいウィンドウで開き、だめなら外側の画面で開く */
    e.preventDefault();
    let w=null; try{w=window.open(tel,'_blank');}catch(_){}
    if(!w){try{window.top.location.href=tel;}catch(_){location.href=tel;}}
    setTimeout(close,300);
  };
  cp.onclick=async()=>{
    let ok=false;
    try{await navigator.clipboard.writeText(num);ok=true;}catch(_){
      const t=document.createElement('textarea');t.value=num;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';
      document.body.appendChild(t);t.select();try{ok=document.execCommand('copy');}catch(__){} t.remove();
    }
    toast(ok?'番号をコピーしました':'コピーできませんでした。番号を長押ししてコピーしてください',ok?'':'err');
  };
  document.getElementById('call-x').onclick=close;
  d.onclick=e=>{if(e.target===d) close();};
  document.onkeydown=e=>{if(e.key==='Escape') close();};
  d.classList.add('on'); setTimeout(()=>go.focus(),30);
}

function pamsFor(it){const s=(it.map||'')+' '+(it.title||''); const ids=[]; SPOT_PAM.forEach(([k,id])=>{if(s.includes(k)&&!ids.includes(id))ids.push(id);}); return ids.slice(0,2).map(pamOf).filter(Boolean);}

/* 実際の集合時間（現地で言われた時刻）。入っていればそれを出発時刻として扱う */
const kOf=it=>it.di+'-'+it.ii;
const meetOf=it=>{const m=MEET[kOf(it)];return m&&(m.t||m.p)?m:null;};
const meetMin=it=>{const m=meetOf(it);return m&&m.t?toMin(DAYS[it.di].date,m.t):null;};
const endOf=it=>{const m=meetMin(it);return m!=null&&m>it.s?m:it.en;};
/* 遅れの反映
   ・「このあと◯分遅れ」が共有されていたら、その予定から後ろをずらす
   ・集合時間は「集まる時刻」で出発ではないので、入れても後ろの予定はずらさない
   ・飛行機は定刻のまま（そこで遅れはリセット） */
let DELAYS={};
try{const c=localStorage.getItem(KEY+'-delay'); if(c) DELAYS=JSON.parse(c)||{};}catch(e){}
function gotDelays(d){DELAYS=d||{};try{localStorage.setItem(KEY+'-delay',JSON.stringify(DELAYS));}catch(e){}}
function applyShift(){
  DAYS.forEach((d,di)=>{
    let sh=0;
    d.items.forEach((it,ii)=>{
      if(it.ps==null){it.ps=it.s;it.pen=it.en;}
      const k=di+'-'+ii;
      if(it.k==='flight') sh=0;
      else if(DELAYS[k]) sh=Number(DELAYS[k].min)||0;
      it.shift=it.k==='flight'?0:sh;
      it.s=it.ps+it.shift; it.en=it.pen+it.shift;
    });
  });
}
const tS=it=>fmtT(it.s), tE=it=>it.e?fmtT(it.en):'';
const planTag=it=>it.shift?`<span class="plantag">予定 ${it.t}</span>`:'';
let editMeet=null;
const SCROLL={};
function status(){
  applyShift();
  const n=nowMin(), list=ALL();
  /* 予定の最中（同時刻に重なる場合は後ろを優先）。集合時間を過ぎても、メモしてあればその時刻まで「いま」のまま */
  let ci=-1; list.forEach((it,i)=>{if(it.s<=n&&n<endOf(it)) ci=i;});
  if(ci<0){ /* 集合時間を少し過ぎただけ（30分以内）なら、まだその場所にいる扱い */
    list.forEach((it,i)=>{const m=meetMin(it); if(m!=null&&n>=m&&n<m+30&&!list.some(x=>x.s>it.s&&x.s<=n)) ci=i;});
  }
  const ni=list.findIndex(it=>it.s>n);
  return {n,list,cur:ci>=0?list[ci]:null,nx:ni>=0?list[ni]:null,ni,
          prev:[...list].reverse().find(it=>endOf(it)<=n)||null};
}
function meetEditor(it,n){
  const m=MEET[kOf(it)]||{};
  const base=Math.ceil(n/5)*5;
  const val=m.t||(it.e||fmtT(base+15));
  return `<div class="meetform">
    <label for="mt">集合時間</label>
    <input type="time" id="mt" value="${val}">
    <div class="quick">${[10,15,20,30].map(x=>`<button class="btn" data-meetq="${fmtT(base+x)}">${x}分後</button>`).join('')}${it.e?`<button class="btn" data-meetq="${it.e}">予定どおり ${it.e}</button>`:''}</div>
    <label for="mp">集合場所</label>
    <input id="mp" value="${esc(m.p||'')}" placeholder="例：第2駐車場のバス、入口の鳥居前">
    <div class="acts"><button class="btn" data-meetsave="${kOf(it)}" style="border-color:var(--lava);color:var(--lava);font-weight:900">保存</button>
    ${meetOf(it)?`<button class="btn" data-meetdel="${kOf(it)}">消す</button>`:''}
    <button class="link" data-meetcancel style="margin-left:auto">やめる</button></div></div>`;
}
function meetCard(it,n){
  const key=kOf(it);
  if(editMeet===key) return meetEditor(it,n);
  const m=meetOf(it);
  if(!m) return `<button class="btn meetadd" data-meetedit="${key}">${ic('flag')}ここの集合時間をメモ</button>`;
  const mm=meetMin(it);
  const left=mm!=null?mm-n:null;
  const cls=left==null?'':left<0?' late':left<=10?' soon':'';
  return `<div class="meet${cls}">
    <div class="mh">${ic('flag')}集合<button class="link" data-meetedit="${key}">変更</button></div>
    ${mm!=null?`<div class="mrow"><span class="mt num">${m.t}</span>
      <span class="left">${left<0?`<span class="num">${dur(-left)}</span><br>過ぎています`:`あと<br><span class="num">${dur(left)}</span>`}</span></div>`:''}
    ${m.p?`<div class="place">${esc(m.p)}</div>`:''}
    ${it.e?`<div class="plan">予定表では ${it.t}〜${it.e}</div>`:''}

  </div>`;
}
function fmtClock(iso){const d=new Date(new Date(iso).getTime()+9*3600e3);return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');}
